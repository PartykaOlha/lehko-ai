name: Build Family Tracker Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'family.html'
      - '.github/workflows/build-family.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare separate family app
        run: |
          mkdir -p app/src/main/assets
          cp family.html app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path("app/build.gradle")
          s=gradle.read_text()
          assert "ua.lehko.ai.stable" in s
          s=s.replace("ua.lehko.ai.stable","ua.lehko.ai.familyv2").replace("versionCode 28","versionCode 1").replace("1.8-beta","family-2.0")
          gradle.write_text(s)
          manifest=Path("app/src/main/AndroidManifest.xml")
          s=manifest.read_text().replace("Легко AI 1.7","Легко AI · Сім’я 2")
          manifest.write_text(s)
          PY
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lehko-ai-family-v2-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
