  function lineSvg(points){if(points.length===0)return `<div class="empty">${ico('chart',33)}<p>Додай запис ваги, щоб побачити графік.</p></div>`;const W=420,H=205,plotL=35,plotR=402,plotT=24,plotB=170,v=points.map(x=>Number(x.kg)),min=Math.min(...v),max=Math.max(...v),span=Math.max(1.8,max-min),ymin=min-(span-(max-min))/2-.2,ymax=ymin+span,xfor=i=>points.length===1?(plotL+plotR)/2:plotL+(plotR-plotL)*i/(points.length-1),yfor=kg=>plotB-(kg-ymin)/(ymax-ymin)*(plotB-plotT),path=points.map((x,i)=>`${i?'L':'M'}${xfor(i).toFixed(1)},${yfor(x.kg).toFixed(1)}`).join(' ');let ax=[0,.5,1].map(a=>{const y=plotT+a*(plotB-plotT);return `<line x1="${plotL}" x2="${plotR}" y1="${y}" y2="${y}" stroke="#ece2fa"/><text x="0" y="${y+4}" font-size="11" fill="#8975ab">${fmt(ymax-a*span,1)}</text>`}).join('');return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік ваги з ${fmt(min,1)} до ${fmt(max,1)} кілограмів">${ax}<path d="${path}" fill="none" stroke="#7650d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>${points.map((x,i)=>`<circle cx="${xfor(i)}" cy="${yfor(x.kg)}" r="4" fill="#7650d6" stroke="white" stroke-width="2"/>`).join('')}<text x="${plotL}" y="198" font-size="10" fill="#8975ab">${safe(fmtDate(points[0].date,{day:'numeric',month:'short'}))}</text><text x="${plotR}" y="198" text-anchor="end" font-size="10" fill="#8975ab">${safe(fmtDate(points.at(-1).date,{day:'numeric',month:'short'}))}</text></svg>`}
  function progress(){const list=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date));const w=curWeight(),first=list[0]?.kg??w,delta=w-first,goal=data.profile.goal;const days=14,walk=[...Array(days)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(days-i-1));return localDate(d)});return `${pageHead('Прогрес','Важлива тенденція за кілька тижнів, а не коливання ваги за один день.')}<div class="grid2"><div class="mini-card"><div class="muted small">Остання вага</div><div class="big">${fmt(w,1)} <span style="font-size:12px">кг</span></div><div class="small muted">${latestWeightDate()?fmtDate(latestWeightDate()):'ще немає запису'}</div></div><div class="mini-card"><div class="muted small">Зміна з першого запису</div><div class="big">${delta>0?'+':''}${fmt(delta,1)} <span style="font-size:12px">кг</span></div><div class="small muted">Мета ${fmt(goal,1)} кг</div></div></div>
    <div class="section"><h2>Тенденція ваги</h2><button class="btn secondary sm" data-action="add-weight">${ico('plus',15)} Записати</button></div><div class="card flat">${lineSvg(list)}<p class="caption">Зважування в однакових умовах зручніше для порівняння; денні коливання нормальні.</p></div>
    <div class="section"><h2>Харчування за 14 днів</h2></div><div class="card flat"><div class="bar-days" style="height:116px">${walk.map(d=>{const k=dayTotals(d).k;return `<div class="daycol ${d===localDate()?'today':''}"><div class="daybar" style="height:${k?Math.max(6,Math.min(108,k/(data.profile.calories*1.2)*100)):3}px" title="${safe(fmtDate(d))}: ${fmt(k)} ккал"></div><span>${new Date(d+'T12:00:00').getDate()}</span></div>`}).join('')}</div><p class="caption" style="margin-top:11px">Показує записані дані. Відсутні записи не зараховуються як нульове споживання.</p></div>
    <div class="section"><h2>Усі зважування</h2></div><div class="card flat">${list.length?list.slice().reverse().map(x=>`<div class="tile"><span class="foodglyph">${ico('scale',21)}</span><div class="tiletext"><strong>${fmt(x.kg,1)} кг</strong><span>${safe(fmtDate(x.date,{day:'numeric',month:'long',year:'numeric'}))}</span></div><button class="btn ghost" data-action="delete-weight" data-date="${safe(x.date)}" aria-label="Видалити зважування">${ico('trash',17)}</button></div>`).join(''):'<p class="muted">Поки немає записів.</p>'}</div>
    <div class="tip amber"><strong>Реалістична швидкість</strong><p>Орієнтир для поступових змін — приблизно 0,25–0,75 кг на тиждень, але це не обов’язковий темп. Самопочуття та сталі звички важливіші за цифру.</p></div>`}
  function coach(){return `${pageHead('Твій AI-помічник','Ідеї страв, підказки за щоденником і аналіз їжі за фотографією.')}${chatgptConnectCard()}<div class="card"><div class="advice-head"><span class="assistant-face">${ico('sparkles',23)}</span><div><h2>План без крайнощів</h2><div class="muted small">Локальні поради · ChatGPT Plus після підключення · або OpenAI API</div></div></div><div class="tip" style="margin-bottom:12px"><strong>Персональна підказка</strong><p>${safe(getAdvice())}</p></div><div class="quick-tags" style="margin:15px 0"><button class="tag" data-action="coach-quick" data-value="Що з'їсти на вечерю?">Ідеї для вечері</button><button class="tag" data-action="coach-quick" data-value="Хочеться солодкого">Хочу солодкого</button><button class="tag" data-action="coach-quick" data-value="Як добрати білок?">Більше білка</button><button class="tag" data-action="coach-quick" data-value="Як мій прогрес?">Мій прогрес</button></div><div id="chatbox" class="chatbox" aria-label="Діалог з помічником">${data.messages.length?data.messages.slice(-18).map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${m.role==='assistant'?'<span class="meta">Легко AI</span>':''}${safe(m.text)}</div>`).join(''):'<div class="muted small" style="padding:12px 0">Напиши, що є в холодильнику, або запитай, як збалансувати наступний прийом їжі.</div>'}</div><form id="chatForm" class="chatentry"><textarea id="chatInput" placeholder="Наприклад: маю курку, гарбуз і гречку..." maxlength="900" rows="2" required aria-label="Повідомлення для AI"></textarea><button type="submit" aria-label="Відправити" ${uiBusy?'disabled':''}>${ico('send',19)}</button></form><p class="caption" style="margin:11px 0 0">Без підключення діють локальні правила. Із ChatGPT Plus або власним API-ключем — генеративний AI.</p></div>
    ${nativeStatus.connected?`<div class="card flat"><strong>Підсумок щоденника для AI</strong><p class="small muted" style="margin:8px 0">Коли запитуєш у AI-помічника про їжу, він автоматично отримує актуальні записи з цього застосунку: вагу, цілі, БЖВ та режим харчування. Лише після твоєї згоди й натискання на AI-запит. Це не синхронізація із чатами ChatGPT.</p></div>`:`<div class="card flat"><div class="between"><div><strong>Перенести підсумок у ChatGPT вручну</strong><p class="small muted" style="margin:4px 0 0">Поки ChatGPT Plus не підключено до AI, скопіюй підсумок та встав у розмову. Автоматичного обміну з цією розмовою немає.</p></div>${ico('copy',22)}</div><div class="btn-row" style="margin-top:12px"><button class="btn secondary grow" data-action="copy-context">Копіювати мій день</button><a class="btn light grow" href="https://chatgpt.com/" target="_self" rel="noreferrer" style="text-decoration:none">Перейти в ChatGPT ↗</a></div></div>`}
    <div class="section"><h2>Оцінка їжі за фото</h2><span class="pill soft">${nativeStatus.connected?'ChatGPT Plus':apiKey?'OpenAI API':'Потрібне підключення'}</span></div><div class="card flat"><label class="photobox" for="photoInput" id="photoBox">${photoData?`<img src="${photoData}" alt="Попередній перегляд обраного фото"><span class="small">${safe(photoName)}</span>`:`${ico('camera',30)}<strong>Додай або зроби фото страви</strong><span class="small muted">Краще зняти тарілку зверху, при хорошому світлі</span>`}<input id="photoInput" type="file" accept="image/*" ></label><div class="field" style="margin-top:12px"><label for="photoNote">Деталі (необов’язково)</label><textarea id="photoNote" placeholder="Наприклад: куряче філе 150 г, салат із 1 ч. л. олії..." rows="2"></textarea></div><button data-action="analyze-photo" class="btn full" ${!photoData||uiBusy?'disabled':''}>${ico('sparkles',17)} ${uiBusy?'Аналізую...':'Оцінити калорії та БЖВ'}</button><p class="caption" style="margin:9px 0 0">З фото не можна точно визначити вагу, олію чи інгредієнти. AI дає попередню оцінку. Фото надсилається OpenAI тільки після твого натискання.</p>${suggestedFood?`<div class="tip amber" style="margin-top:15px"><strong>${safe(suggestedFood.name)}</strong><p>Орієнтовно ${fmt(suggestedFood.grams)} г · ${fmt(suggestedFood.k*suggestedFood.grams/100)} ккал · білок ${fmt(suggestedFood.p*suggestedFood.grams/100)} г</p><p>${safe(suggestedFood.notes||'Уточни інгредієнти й порцію.')}</p><div class="btn-row" style="margin-top:12px"><button class="btn sm" data-action="photo-save">Додати в щоденник</button><button class="btn light sm" data-action="photo-edit">Редагувати порцію</button></div></div>`:''}</div>

  function profile(){const p=data.profile;return `${pageHead('Мої налаштування','Змінюй орієнтири під свій спосіб життя — без гонитви за ідеалом.')}<div class="card"><h2 style="margin-bottom:15px">Особистий план</h2><form id="profileForm"><div class="rowfields"><div class="field"><label for="height">Зріст, см</label><input id="height" name="height" type="number" min="120" max="220" step="1" value="${safe(p.height)}" required></div><div class="field"><label for="goal">Бажана вага, кг</label><input id="goal" name="goal" type="number" min="35" max="250" step="0.1" value="${safe(p.goal)}" required></div></div><div class="rowfields"><div class="field"><label for="calories">Калорії, орієнтир/день</label><input id="calories" name="calories" type="number" min="1200" max="4500" step="50" value="${safe(p.calories)}" required></div><div class="field"><label for="protein">Білок, г/день</label><input id="protein" name="protein" type="number" min="30" max="260" step="5" value="${safe(p.protein)}" required></div></div><div class="rowfields"><div class="field"><label for="water">Вода, мл/день</label><input id="water" name="water" type="number" min="500" max="4500" step="100" value="${safe(p.water)}" required></div><div class="field"><label for="steps">Кроки, орієнтир/день</label><input id="steps" name="steps" type="number" min="500" max="30000" step="500" value="${safe(p.steps)}" required></div></div><button class="btn full" type="submit">${ico('check',16)} Зберегти орієнтири</button></form><p class="caption" style="margin-top:11px">Стартові 1800 ккал — приблизний робочий орієнтир, а не призначена дієта. Не знижуй калорійність різко без професійної консультації.</p></div>
    <div class="section"><h2>Інтервальне харчування</h2><span class="pill">За бажанням</span></div><div class="card flat"><p class="muted small">Задай час прийомів їжі. Для результату важливіше загальний раціон і сталі звички, а не саме вікно.</p><form id="fastForm"><div class="field"><label for="fastMode">Оберіть режим</label><select id="fastMode" name="fastMode"><option value="off" ${p.fastMode==='off'?'selected':''}>Без інтервального харчування</option><option value="12:12" ${p.fastMode==='12:12'?'selected':''}>12:12 — м’який режим</option><option value="14:10" ${p.fastMode==='14:10'?'selected':''}>14:10 — помірний</option><option value="16:8" ${p.fastMode==='16:8'?'selected':''}>16:8 — коротше вікно</option><option value="18:6" ${p.fastMode==='18:6'?'selected':''}>18:6 — більш обмежувальний</option></select></div><div class="field"><label for="fastStart">Початок вікна харчування</label><input type="time" id="fastStart" name="fastStart" value="${safe(p.fastStart||'10:00')}" required></div><button class="btn secondary full" type="submit">${ico('check',16)} Зберегти режим</button></form><div class="disclosure" style="margin-top:12px">Не рекомендовано починати голодування без узгодження з лікарем при вагітності, грудному вигодовуванні, діабеті, розладах харчової поведінки або якщо ліки потрібно приймати з їжею.</div></div>
    ${chatgptConnectCard()}<div class="section"><h2>Альтернатива: OpenAI API-ключ</h2></div><div class="card flat"><div class="between"><strong>OpenAI (API-ключ)</strong><span class="pill ${apiKey?'':'soft'}">${apiKey?'Підключено на цю сесію':'Не підключено'}</span></div><p class="muted small" style="margin-top:8px">Якщо підключено ChatGPT Plus, ключ не потрібен. Альтернативно можеш використати власний ключ OpenAI API. Ключ діє лише до закриття застосунку; для особистого тестування на своєму пристрої, не для поширення APK з ключем. ChatGPT Plus не надає API-ключ. Виклики API оплачуються окремо. Для безкоштовного переходу використовуй кнопку ChatGPT у вкладці «AI».</p><div class="field"><label for="apiKey">OpenAI API key</label><input id="apiKey" type="password" placeholder="Встав ключ для цього сеансу" autocomplete="off" spellcheck="false"></div><div class="field"><label for="aiModel">Модель OpenAI</label><input id="aiModel" type="text" value="${safe(p.model||'gpt-4.1-mini')}" placeholder="gpt-4.1-mini"></div><div class="btn-row"><button class="btn secondary grow" data-action="connect-ai">${ico('sparkles',16)} Використати ключ</button><button class="btn light sm" data-action="forget-key">Забути ключ</button></div><p class="caption" style="margin-top:10px">Отримати ключ: <a class="link" href="https://platform.openai.com/api-keys" target="_self" rel="noreferrer">OpenAI Platform</a>. Нікому не передавай API-ключ.</p></div>
    <div class="section"><h2>Резервна копія</h2></div><div class="card flat"><p class="muted small">Записи знаходяться в браузері цього пристрою. Вони можуть зникнути після очищення даних браузера. Збережи файл із резервною копією.</p><div class="btn-row"><button data-action="export" class="btn secondary grow">${ico('download',17)} Зберегти дані</button><button data-action="import" class="btn light grow">Імпортувати</button><input id="uploadRestore" type="file" accept="application/json,.json"></div><div class="divider"></div><button data-action="reset" class="btn warn full sm">Очистити щоденник і налаштування</button></div><div class="tip blue"><strong>Про безпеку</strong><p>Застосунок не замінює дієтолога або лікаря. Якщо ти вагітна, годуєш грудьми, маєш діабет, розлади харчової поведінки чи інші медичні обставини — план потребує індивідуального погодження.</p></div><div class="small muted" style="text-align:center;margin:22px 0 0">Легко AI · версія 1.8 Beta · Android та ChatGPT</div>`}
  function render(){document.getElementById('app').innerHTML=header()+(tab==='home'?home():tab==='food'?food():tab==='progress'?progress():tab==='coach'?coach():profile())+nav();}

  function foodForm(food,meal=foodMeal,grams=150,fromPhoto=false){const f=food||DB[0];modal(fromPhoto?'Уточнити AI-оцінку':'Додати продукт',`<form id="foodForm"><div class="field"><label for="fSearch">Продукт або страва</label><input id="fSearch" type="search" placeholder="Почни вводити назву..." value="${safe(fromPhoto?f.name:'')}" autocomplete="off"></div><div id="foodResults" class="result-list" style="${fromPhoto?'display:none':'display:block'}">${foodResultsHtml('')}</div><input type="hidden" id="fId" value="${safe(fromPhoto?'photo':f.id)}"><div class="field" style="margin-top:14px"><label for="fName">Назва у щоденнику</label><input id="fName" required value="${safe(fromPhoto?f.name:f.name)}" maxlength="85"></div><div class="rowfields"><div class="field"><label for="fGrams">Порція, г/мл</label><input id="fGrams" type="number" min="1" max="3000" step="1" required value="${fmt(grams)}"></div><div class="field"><label for="fMeal">Прийом їжі</label><select id="fMeal">${mealNames.map(m=>`<option ${m===meal?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="eyebrow" style="margin-bottom:12px">Харчова цінність на 100 г</div><div class="rowfields"><div class="field"><label for="fK">Ккал</label><input id="fK" type="number" min="0" max="950" step="0.1" required value="${safe(f.k)}"></div><div class="field"><label for="fP">Білки, г</label><input id="fP" type="number" min="0" max="100" step="0.1" required value="${safe(f.p)}"></div><div class="field"><label for="fF">Жири, г</label><input id="fF" type="number" min="0" max="100" step="0.1" required value="${safe(f.f)}"></div><div class="field"><label for="fC">Вуглеводи, г</label><input id="fC" type="number" min="0" max="100" step="0.1" required value="${safe(f.c)}"></div></div><div class="between" style="margin-bottom:13px"><label for="fSaveCustom" class="small"><input type="checkbox" id="fSaveCustom"> Зберегти як власний продукт</label><span class="caption">Оцінка, не лабораторний аналіз</span></div><button type="submit" class="btn full">${ico('plus',17)} Додати до щоденника</button></form>`)}
  function foodResultsHtml(q){const query=(q||'').toLocaleLowerCase('uk-UA').trim();const items=(query?allFoods().filter(x=>x.name.toLocaleLowerCase('uk-UA').includes(query)):allFoods().slice(0,18)).slice(0,24);return items.length?items.map(f=>`<button type="button" class="food-result" data-action="choose-food" data-id="${safe(f.id)}"><span class="foodglyph" style="width:34px;height:34px;border-radius:10px;font-size:18px">${safe(f.emoji)}</span><div style="flex:1"><strong>${safe(f.name)}</strong><span>${fmt(f.k)} ккал · білок ${fmt(f.p,1)} г /100 г</span></div></button>`).join(''):`<div class="muted small" style="padding:14px">Немає в базі. Впиши назву та дані вручну.</div>`}
  function selectedFoodSet(f){if(!f)return;for(const [id,value] of Object.entries({fId:f.id,fName:f.name,fK:f.k,fP:f.p,fF:f.f,fC:f.c})){const el=document.getElementById(id);if(el)el.value=value}const sr=document.getElementById('foodResults');if(sr)sr.style.display='none'}

  function chatgptContext(){const d=localDate(),t=dayTotals(d),list=dayFoods(d);return `Допоможи мені з поступовим схудненням, без екстремальних дієт та заборон. Мій зріст ${data.profile.height} см, остання записана вага ${fmt(curWeight(),1)} кг (дата: ${latestWeightDate()||'немає'}), бажана вага ${fmt(data.profile.goal,1)} кг. Мій режим харчування ${data.profile.fastMode||'off'}, початок вікна ${data.profile.fastStart||'10:00'}. Мій приблизний налаштований орієнтир ${data.profile.calories} ккал і ${data.profile.protein} г білка на день, не медичне призначення. Сьогодні (${d}) записано ${Math.round(t.k)} ккал, білок ${Math.round(t.p)} г, жири ${Math.round(t.f)} г, вуглеводи ${Math.round(t.c)} г. Продукти сьогодні: ${list.length?list.map(x=>x.name+' — '+fmt(x.grams)+' г').join('; '):'ще не записано'}. Будь ласка, врахуй можливість неповного щоденника, дай реалістичні персональні поради, ідеї наступного прийому їжі, без надто низької калорійності. Якщо я додаю фото, оціни страву лише приблизно та спитай про інгредієнти й вагу.`}
  async function copyContext(){const txt=chatgptContext();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(txt);toast('Контекст скопійовано. Встав його в ChatGPT.');return}}catch(e){}modal('Запит для ChatGPT',`<p class="muted small">Виділи й скопіюй текст нижче, а тоді встав у ChatGPT.</p><div class="field"><textarea rows="9" readonly id="copyText">${safe(txt)}</textarea></div><button class="btn full" data-action="select-context">Виділити весь текст</button>`)}
  function offlineAnswer(q){const msg=q.toLocaleLowerCase('uk-UA'),total=dayTotals(localDate()),p=data.profile,missing=Math.max(0,p.protein-total.p),remain=p.calories-total.k,w=curWeight();let s='';if(/вечер|обід|з.їсти|зїсти|страв|готува|курк|гарбуз|гречк/.test(msg)){s=`Ідея: запечене куряче філе або риба (120–160 г), велика порція овочів і 100–150 г готової гречки чи картоплі. Додай олію за бажанням і запиши її окремо. ${remain>0?'До денного орієнтира залишилося близько '+fmt(remain)+' ккал, але не потрібно підганяти кожен прийом їжі під точне число.':''}`}
  else if(/солод|торт|шоколад|пмс|голод/.test(msg)){s='Солодке не потрібно забороняти. Якщо хочеться десерту, обери порцію, яка принесе задоволення, і додай до неї щось ситне, наприклад йогурт або кисломолочний сир. Якщо голодна ввечері, подумай про достатній обід і білок протягом дня. Перед менструацією апетит може змінюватися — це нормально.'}
  else if(/біл|протеїн|сир|яйц/.test(msg)){s=`Сьогодні записано орієнтовно ${fmt(total.p)} г білка. До твого робочого орієнтира ще близько ${fmt(missing)} г. Варіанти: 150 г кисломолочного сиру (~25 г білка), 120 г запеченої курки (~37 г) або 200 г натурального йогурту (~8 г). Перевір дані упаковки.`}
  else if(/прогрес|ваг|схуд|ціл|результ/.test(msg)){s=`Остання записана вага ${fmt(w,1)} кг, бажана — ${fmt(p.goal,1)} кг. Вага змінюється через воду, цикл, сон і харчування. Краще дивитися на середній тренд за 2–4 тижні. Для поступового схуднення важливі регулярне харчування, рух і сон.`}
  else if(/вод|пит/.test(msg)){s=`Сьогодні зафіксовано ${fmt(data.water[localDate()]||0)} мл води. Твій налаштований орієнтир — ${fmt(p.water)} мл. Потреба залежить від спеки, активності й стану здоров'я; орієнтуйся також на спрагу.`}

  async function gemini(textPrompt,img=null,json=false){
    if(nativeStatus.connected && window.LehkoAndroid){if(!allowSharing())throw new Error('Згоду на надсилання даних не надано.');return await nativeAsk(textPrompt,img);}
    if(!apiKey)throw new Error('Підключи ChatGPT Plus або введи OpenAI API-ключ у вкладці «Моє».');
    const model=data.profile.model||'gpt-4.1-mini';
    if(!/^[a-zA-Z0-9._-]{3,70}$/.test(model))throw new Error('Перевір назву моделі.');
    const content=[{type:'input_text',text:textPrompt}];
    if(img)content.push({type:'input_image',image_url:img,detail:'auto'});
    let response;
    try{response=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},body:JSON.stringify({model,input:[{role:'user',content}],max_output_tokens:json?750:600})})}
    catch(err){throw new Error('Не вдається зв’язатися з OpenAI. Перевір інтернет або відкрий ChatGPT кнопкою нижче.')}
    const obj=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error((obj.error?.message||`OpenAI повернув код ${response.status}`).slice(0,230));
    const answer=(obj.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text||'').join('\n').trim() || String(obj.output_text||'').trim();
    if(!answer)throw new Error('OpenAI не повернув текст. Спробуй ще раз.');return answer;
  }
  async function askCoach(q){if(!q.trim()||uiBusy)return;data.messages.push({role:'user',text:q.trim()});persist();render();if(!apiKey&&!nativeStatus.connected){data.messages.push({role:'assistant',text:offlineAnswer(q)});persist();render();scrollChat();return}uiBusy=true;render();const recentWeight=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-5).map(w=>w.date+': '+fmt(w.kg,1)+' кг').join('; ');const context=`Ти помічник з харчування українською для дорослої людини. Не став діагнози, не давай небезпечних або дуже низькокалорійних дієт, не схвалюй компенсаторне голодування. Не роби категоричних висновків з неповних даних. Відповідь 3–6 речень, конкретна. Нижче приватний контекст із застосунку, який користувач погоджується передати лише для цього запиту. ${chatgptContext()} Останні вимірювання ваги: ${recentWeight||'немає'}. Якщо є медичні симптоми — порадь лікаря. Нове запитання: ${q}`;try{const answer=await gemini(context);data.messages.push({role:'assistant',text:answer})}catch(err){data.messages.push({role:'assistant',text:'Зараз онлайн-AI недоступний: '+err.message+'\n\nЛокальна порада: '+offlineAnswer(q)})}finally{uiBusy=false;persist();render();scrollChat()}}

  function readImage(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')){reject(new Error('Обери зображення.'));return}if(file.size>14*1024*1024){reject(new Error('Зображення понад 14 МБ. Зменш його перед завантаженням.'));return}const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);resolve(cv.toDataURL('image/jpeg',.78))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Не вдалося прочитати фото.'))};img.src=url})}
  async function analyzePhoto(){if(uiBusy||!photoData)return;if(!apiKey&&!nativeStatus.connected){toast('Для фото потрібно підключити ChatGPT Plus або OpenAI API.');return}const note=(document.getElementById('photoNote')?.value||'').slice(0,500);uiBusy=true;render();try{const prompt=`Це фото їжі. Актуальний контекст щоденника: ${chatgptContext()}. Уважно оціни страву, але не стверджуй точність з одного фото. Опис користувача: ${note||'немає'}. Поверни ЛИШЕ JSON-об'єкт: {"name":"назва страви українською", "grams": 250, "k": 120, "p": 8, "f": 4, "c": 13, "notes":"що невідомо і як уточнити"}. grams = приблизна вага всієї порції в грамах; k,p,f,c = калорії та грами БЖВ НА 100 грамів їжі (НЕ на порцію). Усі числові поля невід'ємні, grams від 20 до 2000, ккал від 0 до 900, макроелементи 0-100. Врахуй приховане масло, соуси як джерело невизначеності. Якщо їжу на фото не визначити, поверни notes про неможливість точної оцінки. Поясни припущення у notes. Ніякого Markdown.`;const output=await gemini(prompt,photoData,true);let json;try{json=JSON.parse(output.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim())}catch(e){throw new Error('Не вдалося прочитати JSON-відповідь OpenAI. Спробуй інше фото.')}for(const x of ['grams','k','p','f','c'])json[x]=Number(json[x]);if(!json.name||!Number.isFinite(json.grams)||json.grams<20||json.grams>2000||!Number.isFinite(json.k)||json.k<0||json.k>900||['p','f','c'].some(x=>!Number.isFinite(json[x])||json[x]<0||json[x]>100))throw new Error('AI повернув неповні оцінки. Уточни фото або введи страву вручну.');suggestedFood={name:String(json.name).slice(0,85),grams:json.grams,k:json.k,p:json.p,f:json.f,c:json.c,notes:String(json.notes||'').slice(0,400),estimated:true,emoji:'🍽️'};toast('Оцінку готово. Перевір дані перед додаванням.')}catch(err){toast('Не вдалося проаналізувати: '+err.message)}finally{uiBusy=false;render()}}
  async function importBackup(file){if(!file)return;try{if(file.size>4*1024*1024)throw Error('Файл завеликий.');const obj=JSON.parse(await file.text());if(!obj||!obj.profile||!Array.isArray(obj.foods)||!Array.isArray(obj.weights)||!obj.water||!obj.steps)throw Error('Це не резервна копія Легко AI.');if(!confirm('Замінити поточні дані записами з резервної копії?'))return;const d=structuredClone(DEFAULT);d.profile={...d.profile,...Object.fromEntries(Object.entries(obj.profile).filter(([k])=>k in d.profile))};d.foods=obj.foods.slice(0,10000).filter(x=>x&&typeof x.name==='string'&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&['k','p','f','c','grams'].every(k=>Number.isFinite(Number(x[k]))));d.weights=obj.weights.slice(0,2000).filter(x=>x&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&Number(x.kg)>20&&Number(x.kg)<500);d.water=obj.water;d.steps=obj.steps;d.custom=Array.isArray(obj.custom)?obj.custom.slice(0,300):[];d.messages=Array.isArray(obj.messages)?obj.messages.slice(-80).filter(x=>['user','assistant'].includes(x.role)&&typeof x.text==='string'):[];data=d;persist();render();toast('Дані імпортовано.')}catch(err){toast('Помилка імпорту: '+err.message)}}

  document.addEventListener('input',e=>{if(e.target.id==='fSearch'){const r=document.getElementById('foodResults');if(r){r.innerHTML=foodResultsHtml(e.target.value);r.style.display='block'}const custom=document.getElementById('fId');if(custom){custom.value='custom';document.getElementById('fName').value=e.target.value;for(const id of ['fK','fP','fF','fC'])document.getElementById(id).value=''}}});
  document.addEventListener('change',async e=>{if(e.target.id==='foodDate'){selectedDate=e.target.value||localDate();render();return}if(e.target.id==='photoInput'){try{photoData=await readImage(e.target.files?.[0]);photoName=e.target.files?.[0]?.name||'Фото страви';suggestedFood=null;render();toast('Фото додано. Натисни «Оцінити», щоб надіслати AI.')}catch(err){toast(err.message)}return}if(e.target.id==='uploadRestore'){await importBackup(e.target.files?.[0]);return}});
  document.addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
  </script>
</body>
</html>
