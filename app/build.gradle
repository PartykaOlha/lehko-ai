plugins {
    id 'com.android.application'
}
android {
    namespace 'ua.lehko.ai'
    compileSdk 35
    defaultConfig {
        // Beta uses a distinct package ID to avoid conflicts with previously signed preview builds.
        applicationId 'ua.lehko.ai.beta'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.7-beta'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
