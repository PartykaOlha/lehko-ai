plugins {
    id 'com.android.application'
}
android {
    namespace 'ua.lehko.ai'
    compileSdk 35
    defaultConfig {
        // Test package is separate: never overwrite an already-installed signed v1.2 APK.
        applicationId 'ua.lehko.ai.preview'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.3-preview'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
