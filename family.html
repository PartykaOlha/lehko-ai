function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));const page=$('#page');page.innerHTML=({menu:showMenu,shop:showShop,habit:showHabits,weight:showWeight,gifts:showGifts}[state.tab])()}
function picker(id){return `<select class="field" id="${id}" aria-label="Тиждень">${weeks.map((w,i)=>`<option value="${i}" ${i===state.week?'selected':''}>Тиждень ${i+1} · ${nice(w.d[0].d)} — ${nice(w.d.at(-1).d)}</option>`).join('')}</select>`}
function showMenu(){const week=weeks[state.week];if(!week.d.some(x=>x.d===state.day))state.day=week.d[0].d;const day=week.d.find(x=>x.d===state.day);let map=[['Сніданок',day.b],['Обід',day.l],['Вечеря',day.s],['Перекус / десерт',day.t]];return `<div class="panel hero"><div class="flex"><div><div class="tiny">Сьогодні у плані</div><div class="big">${nice(day.d,{weekday:'long'})}</div><div>${esc(day.p)}</div></div><span class="pill">Тиждень ${state.week+1}/10</span></div></div><h2>Сімейне меню</h2>${picker('menuWeek')}<div class="days" style="margin-top:12px">${week.d.map(x=>`<button class="day ${x.d===day.d?'active':''}" data-day="${x.d}">${esc(dateD(x.d).toLocaleDateString('uk-UA',{weekday:'short'}))}<strong>${dateD(x.d).getDate()}</strong></button>`).join('')}</div><div class="panel">${map.map(([a,b])=>`<div class="meal"><small>${a}</small><strong>${esc(b)}</strong></div>`).join('')}</div><div class="hint">Обід і вечеря використовують один основний білковий продукт. Для дітей — порції за апетитом, молодшому — відповідна текстура.</div><button class="soft" data-goto="shop">Перейти до покупок →</button>`}
function groceryList(){const week=weeks[state.week],cat=week.g.flatMap((g,gi)=>g.i.map((name,i)=>({id:`${state.week}:${gi}:${i}`,name,category:g.c})));(db.custom[state.week]||[]).forEach((s,i)=>cat.push({id:`${state.week}:extra:${i}`,name:s,category:'Додатково'}));return cat}
function showShop(){let list=groceryList(),done=list.filter(x=>db.shop[x.id]).length;const groups=[...new Set(list.map(x=>x.category))];return `<h2>Список покупок</h2><p class="sub">Відмічайте куплене — галочки зберігаються на телефоні.</p>${picker('shopWeek')}<div class="panel hero"><div class="flex"><div><strong>${done} із ${list.length} куплено</strong><div class="tiny">Тиждень ${state.week+1}</div></div><button class="outline" data-action="resetShop">Скинути</button></div><div class="progress" style="margin-top:12px"><span style="width:${list.length?done/list.length*100:0}%"></span></div></div>${groups.map(group=>`<div class="panel"><h3>${esc(group)}</h3>${list.filter(x=>x.category===group).map(x=>`<div class="checkrow"><input type="checkbox" id="g${x.id}" data-shop="${x.id}" ${db.shop[x.id]?'checked':''}><label class="${db.shop[x.id]?'checked':''}" for="g${x.id}">${esc(x.name)}</label></div>`).join('')}</div>`).join('')}<div class="panel"><h3>Додати продукт</h3><div class="edit"><input class="field" id="newItem" placeholder="Наприклад, кефір 1 л" maxlength="100"><button class="primary" data-action="addItem">Додати</button></div></div>`}
function showHabits(){const d=state.habday;const entries=db.habits[d]||{};const total=HABITS.filter(h=>entries[h.id]).length;return `<div class="panel hero"><div class="flex"><div><div class="tiny">Ваш активний страйк</div><div class="big">${activeStreak()} дн.</div><div class="tiny">Хоч одна звичка щодня</div></div><span class="pill">${total}/4 сьогодні</span></div></div><h2>Трекер звичок</h2><p class="sub">Можна відмічати попередні дні. Перерви й дні відпочинку — нормальні.</p><input class="field" type="date" id="habitDate" min="${START}" max="${END}" value="${d}"><div class="panel">${HABITS.map(h=>`<label class="checkrow hab"><span class="em">${h.icon}</span><span style="flex:1"><span class="name">${h.name}</span><span class="note" style="display:block">${h.desc}</span></span><input type="checkbox" data-habit="${h.id}" ${entries[h.id]?'checked':''}></label>`).join('')}</div><div class="feature-grid">${HABITS.map(h=>`<div class="feature"><small>${h.name}</small><b>${habitStreak(h.id)} дн.</b><small>${h.target}</small></div>`).join('')}</div><div class="panel"><h3>Останні 14 днів</h3><div class="days">${allDays.filter(x=>x.d<=today()).slice(-14).map(x=>`<button class="day ${activeDone(x.d)?'active':''}" data-habday="${x.d}"><span>${esc(dateD(x.d).toLocaleDateString('uk-UA',{weekday:'short'}))}</span><strong>${dateD(x.d).getDate()}</strong><span>${activeDone(x.d)?'●':'○'}</span></button>`).join('')}</div></div><div class="notice">Якщо є біль або дискомфорт у стопі чи суглобах, зменшіть навантаження. Орбітрек і гантелі не обов’язково робити щодня.</div><button class="soft" data-goto="gifts">Мої подарунки →</button>`}
function weighs(){const days=[];let d=dateD(FIRST_WEIGH);while(iso(d)<='2026-12-20'){days.push(iso(d));d.setDate(d.getDate()+7)}days.push(END);return days}
function weightChart(){const data=weighs().filter(d=>Number(db.weight[d])>0).map(d=>({d,v:Number(db.weight[d])}));if(data.length<2)return `<div class="notice">Графік з’явиться після другого зважування.</div>`;const lo=Math.min(...data.map(x=>x.v))-0.6,hi=Math.max(...data.map(x=>x.v))+0.6;const px=(i)=>30+i*(320-60)/Math.max(1,data.length-1),py=(v)=>130-(v-lo)/(hi-lo)*100;return `<svg class="chart" viewBox="0 0 350 165" role="img" aria-label="Графік ваги"><line x1="30" y1="130" x2="320" y2="130" stroke="#ddd2f0"/><polyline fill="none" stroke="#7650d6" stroke-width="3" stroke-linejoin="round" points="${data.map((x,i)=>`${px(i)},${py(x.v)}`).join(' ')}"/>${data.map((x,i)=>`<circle cx="${px(i)}" cy="${py(x.v)}" r="4" fill="#7650d6"/>`).join('')}<text x="30" y="15" fill="#77718b" font-size="11">${hi.toFixed(1)} кг</text><text x="30" y="152" fill="#77718b" font-size="11">${data[0].d.slice(5)} → ${data.at(-1).d.slice(5)}</text><text x="265" y="152" fill="#77718b" font-size="11">${lo.toFixed(1)} кг</text></svg>`}
function showWeight(){const items=weighs();const entered=items.filter(x=>Number(db.weight[x])>0).map(x=>({d:x,v:Number(db.weight[x])}));const diff=entered.length>1?(entered.at(-1).v-entered[0].v):null;return `<h2>Трекер ваги</h2><div class="panel hero"><div class="tiny">Перше зважування</div><div class="big">25 жовтня</div><div>Щонеділі вранці, після туалету та до сніданку</div></div><div class="feature-grid"><div class="feature"><small>Записів</small><b>${entered.length}</b></div><div class="feature"><small>Зміна від першого</small><b>${diff===null?'—':(diff>0?'+':'')+diff.toFixed(1)+' кг'}</b></div></div><div class="panel"><h3>Динаміка ваги</h3>${weightChart()}</div><div class="panel"><h3>Дати зважувань</h3>${items.map((d,i)=>`<label class="checkrow" style="align-items:center"><span style="flex:1"><b>${nice(d)}</b><span class="tiny" style="display:block">${i===items.length-1?'Підсумкове, за бажанням':'Неділя'}</span></span><input class="field" style="width:104px;flex:0 0 104px" type="number" inputmode="decimal" min="20" max="350" step="0.1" data-weight="${d}" placeholder="кг" value="${esc(db.weight[d]??'')}"></label>`).join('')}</div><div class="notice">Коливання ваги протягом тижня нормальні. Важливіша загальна тенденція за декілька тижнів, ніж одна цифра.</div>`}
function showGifts(){let highest=maxStreak();return `<div class="panel hero"><div class="tiny">Найдовша серія</div><div class="big">${highest} днів</div><div>Кожен активний день наближає до приємної винагороди.</div></div><h2>Подарунки за страйки</h2><p class="sub">Відкриваються за серії днів, у які виконано хоча б одну звичку. Подарунки можна змінювати.</p>${REWARDS.map(([n,g])=>{const unlocked=highest>=n;const claimed=!!db.claimed[n];return `<div class="panel reward"><span class="medal ${unlocked?'':'locked'}">${unlocked?'✦':'♢'}</span><div class="reward-body"><div class="flex"><b>${n} ${n===1?'день':n<5?'дні':'днів'}</b><span class="pill">${claimed?'Отримано':unlocked?'Відкрито':'Попереду'}</span></div><input data-gift="${n}" value="${esc(db.gifts[n]||g)}" aria-label="Подарунок за ${n} днів" maxlength="150"><small>${unlocked?'Можна забрати подарунок':`Залишилось ${n-highest} дн. до відкриття`}</small>${unlocked?`<label class="checkrow" style="border:0;padding:7px 0"><input type="checkbox" data-claim="${n}" ${claimed?'checked':''}>Подарунок отримано</label>`:''}</div></div>`}).join('')}<div class="panel"><h3>Резервна копія</h3><p class="sub">Усі позначки й вагові записи зберігаються локально. Скопіюйте резервну копію перед зміною телефону або перевстановленням.</p><button class="soft" data-action="backup">Показати код резервної копії</button><div id="backupHolder"></div></div>`}
function backupUI(){let holder=$('#backupHolder');if(!holder)return;holder.innerHTML=`<p class="tiny">Скопіюйте код у нотатки. Для відновлення вставте код сюди й натисніть «Відновити».</p><textarea class="field" id="backupText" rows="7" spellcheck="false">${esc(JSON.stringify(db))}</textarea><div class="flex wrap" style="margin-top:8px"><button class="soft" data-action="copyBackup">Копіювати</button><button class="outline" data-action="restore">Відновити</button></div>`}
async function init(){try{const bin=Uint8Array.from(atob(PACK),x=>x.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Оновіть Chrome або Android System WebView для читання меню.');weeks=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).json();allDays=weeks.flatMap(w=>w.d);state.week=weekIndex(state.day);render()}catch(e){$('#page').innerHTML=`<div class="panel error">Не вдалося відкрити меню: ${esc(e.message)}</div>`}}
$('#nav').addEventListener('click',e=>{const btn=e.target.closest('[data-tab]');if(btn){state.tab=btn.dataset.tab;render();window.scrollTo(0,0)}});
$('#page').addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;const {day,habday,goto,action}=el.dataset;if(day){state.day=day;render()}if(habday){state.habday=habday;render()}if(goto){state.tab=goto;render();window.scrollTo(0,0)}if(action==='resetShop'){if(confirm('Скинути галочки покупок цього тижня?')){Object.keys(db.shop).filter(k=>k.startsWith(state.week+':')).forEach(k=>delete db.shop[k]);save();render()}}if(action==='addItem'){let val=$('#newItem').value.trim();if(val){(db.custom[state.week]??=[]).push(val);save();render()}}if(action==='backup')backupUI();if(action==='copyBackup'){const t=$('#backupText');t.select();try{await navigator.clipboard.writeText(t.value);alert('Резервну копію скопійовано')}catch(x){document.execCommand('copy');alert('Текст виділено. За потреби скопіюйте вручну')}}if(action==='restore'){try{const parsed=JSON.parse($('#backupText').value);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error();if(confirm('Замінити поточні записи резервною копією?')){db={shop:parsed.shop||{},custom:parsed.custom||{},habits:parsed.habits||{},weight:parsed.weight||{},claimed:parsed.claimed||{},gifts:parsed.gifts||{}};save();render()}}catch(x){alert('Некоректний код резервної копії')}}});
$('#page').addEventListener('change',e=>{const t=e.target;const {shop,habit,weight,claim,gift}=t.dataset;if(t.id==='menuWeek'||t.id==='shopWeek'){state.week=Number(t.value);state.day=weeks[state.week].d[0].d;render();return}if(t.id==='habitDate'){state.habday=t.value;render();return}if(shop){db.shop[shop]=t.checked;save();render();return}if(habit){(db.habits[state.habday]??={})[habit]=t.checked;save();render();return}if(weight){let n=t.value.trim().replace(',','.');if(n&&(+n<20||+n>350||!Number.isFinite(+n))){alert('Введіть вагу від 20 до 350 кг');return}if(n)db.weight[weight]=Number(n).toFixed(1);else delete db.weight[weight];save();render();return}if(claim){db.claimed[claim]=t.checked;save();render();return}if(gift){db.gifts[gift]=t.value.trim();save();return}});
init();</script></body></html>
