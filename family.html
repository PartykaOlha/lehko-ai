/* Ten original magical design systems, tokens applied by the appearance controller. */
:root {

const MAGIC_BY_ID=Object.fromEntries(MAGIC_THEMES.map(t=>[t.id,t]));
const COLOR_FIELDS=[['deep','Верхня панель'],['primary','Кнопки'],['accent','Магічний акцент'],['base','Фон екрана'],['paper','Картки'],['ink','Основний текст'],['muted','Другорядний текст'],['pale','М’який фон']];
if(!db.themeColors||typeof db.themeColors!=='object'||Array.isArray(db.themeColors))db.themeColors={};

if(!Array.isArray(db.productCatalog))db.productCatalog=[];
function productCatalog(){
 const items=new Map();
 function include(x){const name=String(x?.name||'').trim(),key=name.toLocaleLowerCase('uk-UA');if(!key)return;const obj={name,unit:String(x.unit||'г'),cat:String(x.cat||'Інше')};if(!items.has(key))items.set(key,obj)}
 for(const d of INITIAL_DAYS)for(const key of ['b','l','s','t'])for(const ing of d.ingredients?.[key]||[])include(ing);
 for(const p of db.productCatalog)include(p);
 for(const day of Object.values(db.mealEdits||{}))for(const m of Object.values(day||{}))for(const ing of m.ingredients||[])include(ing);
 for(const group of Object.values(db.shopExtra||{}))for(const ing of group||[])include(ing);
 return [...items.values()].sort((a,b)=>a.name.localeCompare(b.name,'uk'));
}
function catalogSave(x){const name=String(x?.name||'').trim();if(!name)return;const found=db.productCatalog.find(p=>p.name.toLocaleLowerCase('uk-UA')===name.toLocaleLowerCase('uk-UA'));
 if(!found)db.productCatalog.push({name,unit:String(x.unit||'г').trim(),cat:String(x.cat||'Інше').trim()});
 else if(x.unit&&x.cat){found.unit=x.unit;found.cat=x.cat;}
}
function productSearchInput(value='',extra=false){return `<div class="product-field"><input class="field ${extra?'':'iname'}" ${extra?'id="manualName"':''} data-product-input="1" autocomplete="off" aria-label="Пошук або введення продукту" maxlength="100" placeholder="Оберіть зі списку або введіть новий" value="${esc(value)}"><div class="product-suggestions" hidden></div></div>`}
function productMatches(value){const q=String(value||'').trim().toLocaleLowerCase('uk-UA');const options=productCatalog();return (q?options.filter(p=>p.name.toLocaleLowerCase('uk-UA').includes(q)):options).slice(0,9)}
function updateSuggestions(input){const wrap=input.closest('.product-field'),list=wrap?.querySelector('.product-suggestions');if(!list)return;
 const q=input.value.trim();const options=productMatches(q);
 list.innerHTML=options.map(x=>`<button type="button" class="product-option" data-pickproduct="${esc(x.name)}"><span class="product-dot">✦</span><span>${esc(x.name)}</span><span class="small">${esc(x.unit)} · ${esc(x.cat)}</span></button>`).join('')+(q&&!productCatalog().some(x=>x.name.toLocaleLowerCase('uk-UA')===q.toLocaleLowerCase('uk-UA'))?`<div class="product-new">+ «${esc(q)}» буде додано до ваших продуктів після збереження</div>`:'');list.hidden=!list.children.length;
}
function closeProductSuggestions(){document.querySelectorAll('.product-suggestions').forEach(x=>x.hidden=true)}

function selectedMagic(){return MAGIC_BY_ID[db.theme]||MAGIC_BY_ID.scarlet}
function themeColors(t){const saved=db.themeColors[t.id]||{};const result={...t};for(const [k] of COLOR_FIELDS)if(/^#[0-9a-fA-F]{6}$/.test(saved[k]||''))result[k]=saved[k];return result}

function mealKind(title){
 const s=String(title||'').toLocaleLowerCase('uk-UA');
 const rules=[
 ['soup',/суп|борщ|бульйон|юшк|окрошк|солянк|розсольник/],
 ['fish',/риб|форел|лосос|хек|судак|минтай|скумбр|тунец|оселед/],
 ['syrnyky',/сирник|сирн[иа]к|запіканк.*сир|налисник.*сир/],
 ['omelet',/омлет|яєчн|яйц|яєць|фритат/],
 ['pie',/торт|пиріг|шарлотк|кекс|печив|бісквіт|мафін/],
 ['dessert',/десерт|йогурт|пудинг|мус|желе|галяретк|смузі|кефір|сир кисломолочн/],
 ['porridge',/вівсян|пшонян|каша|пластівц|мюслі/],
 ['fruit',/яблук|банан|груш|персик|полуниц|ягод|фрукт|ківі/],
 ['pasta',/паст[аи]|макарон|спагеті|локшин|вермішел|лазан/],
 ['beans',/нут|сочевиц|горох|квасол|бобов/],
 ['rice',/рис|плов|різото/],
 ['beef',/ялович|теляч|гуляш|бефстроган|рагу.*м'яс/],
 ['poultry',/курк|куряч|індич|філе|котлет|тефтел|фрикадель/],
 ['potato',/картоп|пюре|дерун/],
 ['salad',/салат|вінегрет|зелень|огір|помідор/],
 ['veggies',/брокол|моркв|овоч|гарбуз|капуст|буряк|баклажан/],
 ['bread',/тост|сендвіч|лаваш|хліб|бутерброд|млинц/],
 ];for(const [kind,rx] of rules)if(rx.test(s))return kind;return 'other';
}
function mealImage(title,photo){return typeof photo==='string'&&photo.startsWith('data:image/')?photo:(FOOD_PHOTOS_V8[mealKind(title)]||FOOD_ART_V6[mealKind(title)]||FOOD_PHOTOS_V8.other)}

function useMagic(id,persist=true,redraw=true){
 const t=themeColors(MAGIC_BY_ID[id]||MAGIC_BY_ID.scarlet);
 const root=document.documentElement;
 const values={'--deep':t.deep,'--primary':t.primary,'--accent':t.accent,'--halo':t.glow,'--base':t.base,'--surface':t.paper,'--nav-surface':t.paper+'f2','--contrast':t.ink,'--secondary':t.muted,'--faint':t.pale,'--edge':t.edge,'--surface-muted':t.pale,'--purple':t.primary,'--purple2':t.accent,'--bg':t.base,'--paper':t.paper,'--ink':t.ink,'--muted':t.muted,'--light':t.pale,'--border':t.edge,'--good':t.good};
 Object.entries(values).forEach(([key,value])=>root.style.setProperty(key,value));
 root.style.setProperty('--theme-picture',`url("${themeImage(t.id)}")`);
 root.dataset.theme=t.id;
 const header=document.getElementById('appHeader');if(header)header.setAttribute('data-symbol',t.symbol);
 const subtitle=document.getElementById('themeSubtitle');if(subtitle)subtitle.textContent=t.desc;
 document.querySelectorAll('img[data-magical-scene]').forEach(img=>{img.src=themeImage(t.id);img.alt='Ілюстрація теми '+t.name});
 const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=t.deep;
 if(persist){db.theme=t.id;save()}
 if(redraw){renderMagicOptions();renderColorControls()}else{showColorContrast()}
}
function themeOption(t){const selected=t.id===selectedMagic().id;const c=themeColors(t);
 return `<button type="button" class="theme-option ${selected?'selected':''}" data-theme-option="${t.id}" aria-pressed="${selected}" aria-label="Обрати тему ${t.name}"><div class="theme-art" style="--p-deep:${c.deep};--p-primary:${c.primary};--p-accent:${c.accent}"><img src="${themeImage(t.id)}" alt="" loading="lazy"><span class="theme-symbol" aria-hidden="true">${t.symbol}</span>${selected?'<span class="theme-check">✓</span>':''}</div><div class="theme-info"><strong>${t.name}</strong><small>${t.desc}</small><span class="theme-palette" aria-hidden="true"><i style="--s-color:${c.deep}"></i><i style="--s-color:${c.primary}"></i><i style="--s-color:${c.accent}"></i><i style="--s-color:${c.base}"></i></span></div></button>`
}
function renderMagicOptions(){const host=document.getElementById('themeOptions');if(!host)return;
 host.innerHTML='<div class="settings-category">Чотири пори року</div><div class="theme-grid">'+MAGIC_THEMES.filter(t=>t.type==='season').map(themeOption).join('')+'</div><div class="settings-category">Особисті магічні світи</div><div class="theme-grid">'+MAGIC_THEMES.filter(t=>t.type==='signature').map(themeOption).join('')+'</div><div class="settings-category">Кольорові колекції</div><div class="theme-grid">'+MAGIC_THEMES.filter(t=>t.type==='color').map(themeOption).join('')+'</div>';
}
function renderColorControls(){const host=document.getElementById('paletteControls');if(!host)return;const t=themeColors(selectedMagic());
 host.innerHTML=COLOR_FIELDS.map(([k,label])=>`<div class="palette-control"><label for="color-${k}">${label}</label><div class="color-line"><input type="color" id="color-${k}" data-color-input="${k}" aria-label="${label}" value="${t[k]}"><input type="text" inputmode="text" spellcheck="false" data-color-hex="${k}" aria-label="HEX: ${label}" maxlength="7" value="${t[k]}"></div></div>`).join('');showColorContrast()}
function normalizedHex(v){const s=String(v||'').trim();const pref=s.startsWith('#')?s:'#'+s;return /^#[0-9a-fA-F]{6}$/.test(pref)?pref.toUpperCase():null}
function luminance(hex){const n=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*n[0]+.7152*n[1]+.0722*n[2]}
function colorContrast(a,b){const [x,y]=[luminance(a),luminance(b)].sort((u,v)=>v-u);return (x+.05)/(y+.05)}
function showColorContrast(){const note=document.getElementById('colorContrast');if(!note)return;const c=themeColors(selectedMagic());const value=colorContrast(c.ink,c.paper);note.textContent='Контраст тексту на картках: '+value.toFixed(1)+':1. '+(value>=4.5?'Добре читається.':'Низький контраст — змініть колір тексту або карток для зручного читання.')}
function saveColor(k,value){if(!COLOR_FIELDS.some(([field])=>field===k))return;const valid=normalizedHex(value);if(!valid)return;const t=selectedMagic();(db.themeColors[t.id]??={})[k]=valid;save();useMagic(t.id,false,false);
 const e=document.querySelector(`[data-color-input="${k}"]`),hex=document.querySelector(`[data-color-hex="${k}"]`);if(e&&e.value.toUpperCase()!==valid)e.value=valid;if(hex)hex.value=valid;
 document.querySelectorAll(`[data-theme-option="${t.id}"] .theme-palette i`).forEach((dot,i)=>{const keys=['deep','primary','accent','base'];dot.style.setProperty('--s-color',themeColors(t)[keys[i]])});
}
function settingsSection(which){const colors=which==='colors';document.getElementById('themeOptions').hidden=colors;document.getElementById('paletteEditor').hidden=!colors;for(const [id,on] of [['showThemeGallery',!colors],['showMyColors',colors]]){const b=document.getElementById(id);b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on))}}
function openMagicSettings(){renderMagicOptions();renderColorControls();settingsSection('themes');const layer=document.getElementById('themeSettings');layer.hidden=false;document.body.style.overflow='hidden';document.getElementById('closeSettings').focus()}
function closeMagicSettings(){document.getElementById('themeSettings').hidden=true;document.body.style.overflow='';document.getElementById('openSettings').focus()}
function magicEvents(){
 document.getElementById('openSettings').addEventListener('click',openMagicSettings);
 document.getElementById('closeSettings').addEventListener('click',closeMagicSettings);
 document.getElementById('showThemeGallery').addEventListener('click',()=>settingsSection('themes'));
 document.getElementById('showMyColors').addEventListener('click',()=>{settingsSection('colors');document.getElementById('settingsPanel').scrollTop=0});
 document.getElementById('themeSettings').addEventListener('click',event=>{
  if(event.target.id==='themeSettings'){closeMagicSettings();return}
  if(event.target.id==='resetColors'){const id=selectedMagic().id;delete db.themeColors[id];save();useMagic(id,false);return}
  const b=event.target.closest('[data-theme-option]');if(b){useMagic(b.dataset.themeOption);}
 });
 document.getElementById('themeSettings').addEventListener('input',event=>{const e=event.target;
  if(e.dataset.colorInput){saveColor(e.dataset.colorInput,e.value)}
  if(e.dataset.colorHex){const valid=normalizedHex(e.value);e.classList.toggle('invalid',!valid);if(valid)saveColor(e.dataset.colorHex,valid)}
 });
 document.getElementById('themeSettings').addEventListener('change',event=>{const e=event.target;if(e.dataset.colorHex&&!normalizedHex(e.value)){e.value=themeColors(selectedMagic())[e.dataset.colorHex];e.classList.remove('invalid')}});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.getElementById('themeSettings').hidden)closeMagicSettings()});
}

function guessIngredients(name){let t=String(name||'').toLowerCase(),out=[];const seen=new Set();const add=it=>{const n=it.name.toLowerCase();if(!seen.has(n)){seen.add(n);out.push({...it})}};for(const r of FOOD_RULES){if(r.name==='риба'&&/хек|форел|тунц/.test(t))continue;if(r.keys.some(k=>t.includes(k)))add({name:r.name,qty:r.qty,unit:r.unit,cat:r.cat})}for(const r of EXTRA_RULES)if(r.keys.some(k=>t.includes(k)))r.items.forEach(add);return out}
function meal(d,k){const shift=Math.round((dateD(d)-dateD(db.menuStartDate||FIRST))/86400000);const base=baseDays[advance(FIRST,shift)];const original={title:base?.[k]||'',time:MEALS.find(m=>m[0]===k)?.[2]||'12:00',ingredients:base?.ingredients?.[k]||[]};let override=db.mealEdits[d]?.[k];return override?{...original,...override,ingredients:Array.isArray(override.ingredients)?override.ingredients:original.ingredients}:original}
function weekDays(s){return Array.from({length:7},(_,i)=>advance(s,i))}
function periodEnd(p){return advance(p.start,p.days-1)}
function ensurePeriods(){let changed=false;db.periods.sort((a,b)=>a.start.localeCompare(b.start));let max=0;while(periodEnd(db.periods.at(-1))<nowDate()&&max++<300){const old=db.periods.at(-1);const next=advance(periodEnd(old),1);const days=Math.max(1,Math.min(90,Number(db.nextPeriodDays)||7));db.periods.push({id:'p-'+next,start:next,days,name:`Період ${db.periods.length+1}`});changed=true}if(changed)save()}
function activePeriod(){return db.periods.find(p=>p.start<=nowDate()&&periodEnd(p)>=nowDate())||db.periods.at(-1)}
function currentPeriod(){return db.periods.find(x=>x.id===ui.periodId)||activePeriod()}
function availableTasks(p){return db.tasks.filter(t=>!t.deleted&&t.effectiveStart<=p.start&&(t.repeat||t.singlePeriod===p.id)).sort((a,b)=>(Number.isFinite(a.order)?a.order:db.tasks.indexOf(a))-(Number.isFinite(b.order)?b.order:db.tasks.indexOf(b)))}
function scheduledDay(p,t){return advance(p.start,Math.min(Math.max(1,Number(t.offset)||1),p.days)-1)}
function completed(p,t){return db.taskDone[p.id]?.[t.id]}
function doneTask(p,t,done){(db.taskDone[p.id]??={});if(done){const d=new Date();db.taskDone[p.id][t.id]={date:iso(d),time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}}else delete db.taskDone[p.id][t.id];save()}
function getShopping(s){const map=new Map();const group=(it)=>{const name=String(it.name||'').trim();if(!name)return;const unit=String(it.unit||'').trim();const category=String(it.cat||'Інше');const key=name.toLocaleLowerCase('uk-UA')+'|'+unit.toLowerCase();if(!map.has(key))map.set(key,{key,name,unit,cat:category,qty:0,unspecified:false,from:0});const x=map.get(key);const qty=Number(String(it.qty??'').replace(',','.'));if(Number.isFinite(qty)&&qty>0)x.qty+=qty;else x.unspecified=true;x.from++};for(const d of weekDays(s)){for(const [k] of MEALS){const m=meal(d,k);if(!m.title.trim())continue;for(const ing of m.ingredients||[])group(ing)}}
 const base=map.size?[...map.values()].map(x=>({...x,id:'auto:'+x.key,display:x.qty?shortVal(x.qty)+' '+x.unit+(x.unspecified?' + уточнити':''):'уточнити кількість'})):[];
 let ex=db.shopExtra[s]||[];if(!Array.isArray(ex))ex=[];if(Number((dateD(s)-dateD(FIRST))/86400000)>=0){const weekIdx=Math.floor((dateD(s)-dateD(FIRST))/86400000/7);if(!db.shopExtraMigrated?.[s]&&Array.isArray(db.custom[weekIdx])){ex=[...ex,...db.custom[weekIdx].map(v=>({id:uid(),name:v,qty:'',unit:'',cat:'Додатково'}))];db.shopExtra[s]=ex;(db.shopExtraMigrated??={})[s]=true;save()}}
 return base.concat(ex.map(x=>({...x,id:'manual:'+x.id,display:x.qty?x.qty+' '+(x.unit||''):'за потреби',cat:x.cat||'Додатково'})))}
function checkedShop(s,id){return !!db.shopV2[s]?.[id]}
function markShop(s,id,v){(db.shopV2[s]??={})[id]=v;save()}
function streak(habit){let best=0,n=0,d=FIRST;for(let i=0;i<3000&&d<=nowDate();i++,d=advance(d,1)){const ok=habit?!!db.habits[d]?.[habit]:HABITS.some(([id])=>db.habits[d]?.[id]);n=ok?n+1:0;best=Math.max(best,n)}return best}
function liveStreak(){let d=nowDate();if(!HABITS.some(([id])=>db.habits[d]?.[id]))d=advance(d,-1);let n=0;while(d>=FIRST&&HABITS.some(([id])=>db.habits[d]?.[id])){n++;d=advance(d,-1)}return n}
function nav(tab){if(ui.tab==='ideal'&&ui.selfCareOpen){selfCommit();ui.selfCareOpen=false;ui.selfPauseOpen=false;}ui.tab=tab;ui.recipeOpen=false;ui.recipeSelected=null;ui.mealEdit=null;ui.taskEdit=null;render();window.scrollTo({top:0,behavior:'instant'})}

function childDb(age){if(!db.children||typeof db.children!=='object')db.children={};if(!db.children[age]||typeof db.children[age]!=='object')db.children[age]={};const x=db.children[age];if(!x.plan||typeof x.plan!=='object')x.plan={};if(!x.done||typeof x.done!=='object')x.done={};if(!Array.isArray(x.custom))x.custom=[];return x}

const IDEAL_DEFAULT_ZONES=['Кухня: фасади та стільниця','Ванна й туалет: умивальник, дзеркало','Вітальня: поверхні, диван','Спальня: тумби й пил','Передпокій: взуття та двері','Дитяча: великі іграшки, полиці','Легке підтримувальне прибирання / вихідний'];
function idealData(){
 if(!db.ideal||typeof db.ideal!=='object'||Array.isArray(db.ideal))db.ideal={};
 const d=db.ideal;
 if(!Array.isArray(d.template))d.template=structuredClone(IDEAL_TEMPLATE);
 if(!Array.isArray(d.zones)||d.zones.length!==7)d.zones=[...IDEAL_DEFAULT_ZONES];
 if(!d.done||typeof d.done!=='object')d.done={};
 if(!d.extras||typeof d.extras!=='object')d.extras={};
 if(!d.orders||typeof d.orders!=='object')d.orders={};
 if(!Array.isArray(d.order))d.order=d.template.map(x=>x.id);
 if(!d.template.some(x=>x.id==='school_dropoff')){
   const school=structuredClone(IDEAL_TEMPLATE.find(x=>x.id==='school_dropoff'));
   d.template.splice(Math.min(2,d.template.length),0,school);
   d.order.splice(Math.min(2,d.order.length),0,school.id);
 }
 if(!d.priorities||typeof d.priorities!=='object'||Array.isArray(d.priorities))d.priorities={};
 return d;
}
function idealDay(){return safeDay(ui.idealDate||nowDate())}
function idealWeekIndex(d){return(dateD(d).getDay()+6)%7}
function idealDisplayTitle(task,day){if(task.zone)return task.title+' · '+idealData().zones[idealWeekIndex(day)];return task.title}
function idealEntries(day){const d=idealData(),list=[...d.template.filter(x=>x.id!=='school_dropoff'||idealWeekIndex(day)<5).map(x=>({...x,recurring:true})),...(d.extras[day]||[]).map(x=>({...x,recurring:false}))],order=d.orders[day]||d.order;return list.sort((a,b)=>{const aa=order.indexOf(a.id),bb=order.indexOf(b.id);return (aa<0?99999:aa)-(bb<0?99999:bb)})}
function idealPriorityIds(day){
 const data=idealData(),available=idealEntries(day).filter(x=>x.id!=='school_dropoff');
 const ids=data.priorities[day];
 if(Array.isArray(ids))return [...new Set(ids)].filter(id=>available.some(x=>x.id===id)).slice(0,3);
 const defaults=['baby_play_am','daily_zone','lunch_prep'];
 return defaults.filter(id=>available.some(x=>x.id===id)).slice(0,3);
}
function idealPriorityToggle(day,id){
 const data=idealData(),ids=idealPriorityIds(day);
 if(ids.includes(id))data.priorities[day]=ids.filter(x=>x!==id);
 else if(ids.length<3)data.priorities[day]=[...ids,id];
 else {alert('Три головні справи вже вибрано. Спочатку приберіть одну з трійки.');return}
 save();render();
}
function idealCompletion(day,id){return idealData().done[day]?.[id]||null}
function idealMark(day,id,status){const d=idealData(),task=idealEntries(day).find(t=>t.id===id);if(!task)return;(d.done[day]??={});const previous=d.done[day][id];if(status==='done'&&previous?.status==='done'){delete d.done[day][id]}else if(status==='skip'&&previous?.status==='skip'){delete d.done[day][id]}else d.done[day][id]={status,at:new Date().toISOString()};save();render()}
function idealLink(task,day){if(!task.link)return '';const [section,slot]=task.link.split(':');if(section==='menu'){const m=meal(day,slot);return `<div class="ideal-mini">🍴 ${esc(m.title||'Оберіть страву у меню')}</div><button type="button" data-ideal-link="${esc(task.link)}" class="btn line sm">Перейти до меню</button>`}if(section==='children')return `<button type="button" data-ideal-link="${esc(task.link)}" class="btn line sm">Ідеї ігор</button>`;return `<button type="button" data-ideal-link="habits" class="btn line sm">Мої звички</button>`}

 return `<div class="ideal-task ${done?'done':''} ${skip?'skipped':''}" data-ideal-task-id="${esc(t.id)}"><button type="button" class="ideal-check ${done?'done':''}" aria-label="${done?'Скасувати виконання':'Позначити виконаним'}" data-ideal-done="${esc(t.id)}">${done?'✓':t.emoji||'◉'}</button><div style="min-width:0"><div class="row wrap" style="gap:7px">${hasTime?`<span class="ideal-time">${esc(t.time)}</span>`:''}<span class="small">≈ ${Number(t.minutes)||5} хв</span>${focus?'<span class="tag">У моїй трійці</span>':''}</div><div class="ideal-task-name" style="margin-top:5px">${esc(idealDisplayTitle(t,day))}</div><div class="ideal-mini">${esc(t.tip||'Крок за кроком.')}</div>${done?`<div class="small">✓ ${esc(new Date(c.at).toLocaleString('uk-UA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</div>`:''}${skip?'<div class="small">Пропущено</div>':''}<div class="ideal-row-actions"><button type="button" class="${focus?'':'ideal-btn-primary'}" data-ideal-priority="${esc(t.id)}">${focus?'★ Прибрати з трійки':'☆ До трійки'}</button><button type="button" data-ideal-start="${esc(t.id)}">▶ Таймер</button><button type="button" data-ideal-edit="${esc(t.id)}">Змінити</button>${focus?`<button type="button" data-ideal-move="${esc(t.id)}" data-direction="up" ${index===0?'disabled':''} aria-label="Вище">↑</button><button type="button" data-ideal-move="${esc(t.id)}" data-direction="down" ${index===all.length-1?'disabled':''} aria-label="Нижче">↓</button>`:''}<button type="button" data-ideal-defer="${esc(t.id)}">Завтра</button></div>${idealLink(t,day)}</div></div>`

function selfCommit(){const day=selfDay(),r={...selfRecord(day)};

function mealEditor(){const d=ui.date,k=ui.mealEdit;const title=MEALS.find(x=>x[0]===k)?.[1];const original=meal(d,k);if(!ui.draft)ui.draft=structuredClone(original);const m=ui.draft;return `<div class="card focus"><div class="toolbar"><button class="btn sec sm" data-openrecipes="${k}">Замінити стравою з каталогу</button></div><div class="row between"><h3>${esc(title)} · редагування</h3><button class="btn line sm" data-action="cancelMeal">Закрити</button></div><div class="stack"><div class="input-group"><label>Назва страви</label><input id="mealTitle" class="field" maxlength="180" value="${esc(m.title)}" placeholder="Що будете їсти?"></div><div class="input-group"><label>Час прийому їжі</label><input id="mealTime" type="time" class="field" value="${esc(m.time)}"></div></div><div class="meal-photo-editor"><img id="mealPreview" alt="Ілюстрація для страви" src="${mealImage(m.title,m.photo)}"><div class="stack" style="flex:1"><div class="small">Ілюстрація підбирається за назвою. Можна завантажити власне фото.</div><label class="btn sec sm photo-upload">📷 Своє фото<input type="file" accept="image/*" id="mealPhotoInput" hidden></label><button class="btn line sm" data-action="clearMealPhoto" type="button">Автоматична картинка</button></div></div><hr class="divider"><h3>Продукти для цієї страви</h3><div class="small">Саме з цього переліку формується список покупок.</div><div id="ingredientRows">${(m.ingredients||[]).map((i,n)=>`<div class="card" style="padding:10px" data-ing="${n}"><div class="row between"><b class="small">Продукт ${n+1}</b><button class="btn red sm" data-action="removeIng" data-index="${n}">Видалити</button></div><div class="ingredient">${productSearchInput(i.name)}<input class="field iqty" aria-label="Кількість" inputmode="decimal" type="number" step="0.1" min="0" placeholder="К-ть" value="${esc(i.qty)}"><input class="field iunit" aria-label="Одиниця" maxlength="12" value="${esc(i.unit)}"><input class="field icat wide" aria-label="Категорія" maxlength="40 function pageTasks(){const p=currentPeriod(),ends=periodEnd(p);const tasks=availableTasks(p);const completedCount=tasks.filter(t=>completed(p,t)).length;const current=activePeriod();return `<h2>Справи та таймінг</h2><div class="card hero"><div class="small">Поточна папка справ</div><div class="big">${esc(p.name)}</div><div>${fmtFull(p.start)} — ${fmtFull(ends)} · ${p.days} днів</div><div class="small">Виконано ${completedCount} із ${tasks.length} завдань</div><div class="progress" style="margin-top:9px"><div style="width:${tasks.length?completedCount*100/tasks.length:0}%"></div></div></div><div class="card"><div class="input-group"><label>Переглянути період або історію</label><select class="field" id="periodSelect">${db.periods.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)} · ${fmt(x.start)} — ${fmt(periodEnd(x))}</option>`).join('')}</select></div><div class="toolbar"><button class="btn sec sm" data-action="currentPeriod">Поточний період</button><button class="btn line sm" data-action="newPeriod">Почати наступну папку</button></div><hr class="divider"><div class="input-row"><div class="input-group"><label>Тривалість наступного періоду (днів)</label><input class="field" type="number" id="periodLength" min="1" max="90" step="1" value="${esc(db.nextPeriodDays)}"></div><div class="input-group"><label>Назва поточного періоду</label><input class="field" type="text" id="periodName" maxlength="70" value="${esc(p.name)}"></div></div><div class="toolbar"><button class="btn sec sm" data-action="savePeriod">Зберегти налаштування</button>${p.id===db.periods.at(-1).id?`<button class="btn line sm" data-action="changeCurrentDays">Змінити тривалість цієї папки</button>`:''}</div><div class="small">Коли період закінчується, створюється наступний; виконання в минулих папках зберігаються.</div></div><div class="tabline"><button class="btn ${ui.taskMode==='period'?'':'sec'}" data-taskmode="period">Список справ</button><button class="btn ${ui.taskMode== function taskList(p,tasks){return `<div class="card"><div class="row between"><h3>Завдання у папці</h3><button class="btn sm" data-action="newTask">+ Справа</button></div><div class="small reorder-help">☷ Утримуйте значок із крапками й перетягуйте справи. Або натискайте ↑ та ↓. Порядок запам’ятовується для наступних періодів.</div><div class="task-list" data-sortable="tasks">${tasks.length?tasks.map(t=>taskRow(p,t)).join(''):'<p class="small">Справ поки немає. Створіть свою — вона може повторюватися в кожному новому періоді.</p>'}</div><div class="chips"><button class="btn line sm" data-sample="Придбати продукти">+ Покупки</button><button class="btn line sm" data-sample="Прибирання">+ Прибирання</button><button class="btn line sm" data-sample="Навчання">+ Навчання</button></div></div>`}
function taskRow(p,t){const c=completed(p,t);return `<div class="task" data-sort-id="${esc(t.id)}"><div class="row between"><button type="button" class="drag-handle" aria-label="Перетягнути справу ${esc(t.title)}" title="Перетягніть для зміни порядку">⠿</button><div class="row" style="flex:1;min-width:0"><input type="checkbox" style="width:23px;height:23px;accent-color:var(--purple)" id="task-${esc(t.id)}" data-complete="${esc(t.id)}" ${c?'checked':''}><label for="task-${esc(t.id)}" class="${c?'done':''}" style="flex:1;min-width:0"><div class="task-title">${esc(t.title)}</div><div class="small">${fmt(scheduledDay(p,t))} · ${esc(t.time||'без часу')} · ${Number(t.minutes)||25} хв ${t.repeat?'· повторюється':''}</div></label></div><div class="task-order-actions"><button type="button" class="order-button" aria-label="Підняти справу" data-order="up" data-task="${esc(t.id)}">↑</button><button type="button" class="order-button" aria-label="Опустити справу" data-order="down" data-task="${esc(t.id)}">↓</button><button class="btn sec sm" data-edittask="${esc(t.id)}">✎</button></div></div>${c?`<div class="task-date" style="margin:8px 0 0 31px">Виконано ${fmt(c.date)} о ${esc(c.time||'—')}</div><div class="toolbar" style="margin-left:31px"><label class="small">Виправити дату: </label><input aria-label="Дата виконання" type="date" class="field" style="max-width:170px" data-completion-date="${esc(t.id)}" value="${esc(c.date)}"></div>`:`<div class="toolbar" style="margin-left:31px"><button class="btn line sm" data-action="timerTask" data-task="${esc(t.id)}">Таймер ${Number(t.minutes)||25} хв</button></div>`}</div>`}
function taskEditor(p){const isNew=ui.taskEdit==='new';let t=isNew?{id:'',title:'',offset:1,time:'10:00',minutes:25,repeat:true}:db.tasks.find(x=>x.id===ui.taskEdit);if(!t)return '';return `<div class="card focus"><h3>${isNew?'Нова справа':'Редагувати справу'}</h3><div class="stack"><div class="input-group"><label>Назва</label><input class="field" id="taskTitle" maxlength="140" value="${esc(t.title)}" placeholder="Наприклад, пропилососити"></div><div class="input-row"><div class="input-group"><label>День у періоді (1–${p.days})</label><input id="taskOffset" class="field" type="number" min="1" max="${p.days}" value="${Math.min(Number(t.offset)||1,p.days)}"></div><div class="input-group"><label>Час</label><input id="taskTime" type="time" class="field" value="${esc(t.time||'10:00')}"></div></div><div class="input-group"><label>Тривалість, хвилин</label><input id="taskMinutes" class="field" type="number" min="1" max="480" value="${Number(t.minutes)||25}"></div><label class="check"><input type="checkbox" id="taskRepeat" ${t.repeat?'checked':''}><span>Повторювати в кожному новому періоді</span></label><div class="toolbar"><button class="btn" data-action="saveTask">Зберегти</button><button class="btn line" data-action="cancelTask">Скасувати</button>${!isNew?'<button class="btn red" data-action="deleteTask">Видалити</button>':''}</div></div></div>`}
function agendaView(p){if(ui.agenda<p.start||ui.agenda>periodEnd(p))ui.agenda=p.start;const d=ui.agenda;const items=[];for(const [k,label] of MEALS){const m=meal(d,k);if(m.title)items.push({time:m.time||'12:00',type:'meal',label,title:m.title})}for(const t of availableTasks(p))if(scheduledDay(p,t)===d)items.push({time:t.time||'23:59',type:'task',t,title:t.title,label:'Справа · '+(Number(t.minutes)||25)+' хв'});items.sort((a,b)=>a.time.localeCompare(b.time));return `<div class="card"><h3>Розклад на день</h3><input class="field" id="agendaDate" type="date" min="${p.start}" max="${periodEnd(p)}" value="${d}"><div class="small" style="margin:9px 0">Час і тривалість можна змінювати в редакторі страви або справи.</div>${items.length?items.map(x=>`<div class="schedule time ${x.type==='task'&&completed(p,x.t)?'finished':''}"><div class="small">${esc(x.time)} · ${esc(x.label)}</div><div class="row between"><b>${esc(x.title)}</b>${x.type==='task'?`<input type="checkbox" aria-label="Виконано" data-complete="${esc(x.t.id)}" ${completed(p,x.t)?'checked':''} style="width:22px;height:22px;accent-color:var(--purple)">`:''}</div>${x.type==='task'&&completed(p,x.t)?`<div class="task-date">Виконано ${fmt(completed(p,x.t).date)}</div>`:''}</div>`).join(''):'<p class="small">На цей день немає записів.</p>'}</div>`}

const BODY_PARTS=[['waist','Талія'],['hips','Стегна'],['chest','Груди'],['arm','Рука'],['thigh','Стегно ноги']];
const healthNumber=v=>{if(v===undefined||v===null||String(v).trim()==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null};
function profileScheduled(which){const h=healthProfile(which),cfg=h.schedule,list=[];const interval=Number(cfg.interval)||7;for(let i=0;i<16;i++){let v=cfg.overrides[i]||advance(cfg.start,i*interval);if(/^\d{4}-\d{2}-\d{2}$/.test(v))list.push({index:i,date:v})}return list;}
function profileWeightDates(which){const h=healthProfile(which);return [...new Set([...Object.keys(h.weights),...Object.keys(h.measurements)])].sort();}
function bmiOf(which){const h=healthProfile(which);const height=healthNumber(h.height);const recent=Object.entries(h.weights).filter(([d,w])=>healthNumber(w)>0).sort((a,b)=>a[0].localeCompare(b[0])).at(-1);return height>=100&&height<=230&&recent?{value:healthNumber(recent[1])/((height/100)**2),date:recent[0],weight:healthNumber(recent[1])}:null;}

function weightChartSvg(entries){if(entries.length<2)return '';const vals=entries.map(x=>Number(x[1])),minimum=Math.min(...vals),maximum=Math.max(...vals),span=Math.max(1,maximum-minimum),n=entries.length,w=320,h=130,points=vals.map((v,i)=>[16+i*288/(n-1),14+90*(maximum-v)/span]);const line=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)).join(' ');const bottom=points.at(-1);return `<div class="card"><div class="row between"><h3>Графік ваги</h3><span class="tag">${n} записів</span></div><svg class="weight-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Графік динаміки ваги"><defs><linearGradient id="weightFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".35"/><stop offset="1" stop-color="var(--primary)" stop-opacity=".015"/></linearGradient></defs><path d="${line} L${bottom[0].toFixed(1)},112 L16,112 Z" fill="url(#weightFill)"/><path d="${line}" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>${points.map(([x,y],i)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===n-1?4.5:2.7}" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"/>`).join('')}<text x="14" y="125" fill="var(--secondary)" font-size="11">${fmt(entries[0][0])}</text><text x="306" y="125" fill="var(--secondary)" font-size="11" text-anchor="end">${fmt(entries.at(-1)[0])}</text></svg></div>`}
function pageWeight(){const key=ui.profile, h=healthProfile(key), records=Object.entries(h.weights).filter(([d,v])=>healthNumber(v)>0).sort((a,b)=>a[0].localeCompare(b[0])),latest=records.at(-1),first=records[0],diff=latest&&first?Number(latest[1])-Number(first[1]):null,bmi=bmiOf(key),bod=bodySummary(key),schedule=profileScheduled(key),all=profileWeightDates(key),done=records.length;

<div class="profile-switcher" role="group" aria-label="Профіль"><button type="button" class="profile-btn ${key==='me'?'selected':''}" data-profile="me">✦ ${esc(healthProfile('me').label)}</button><button type="button" class="profile-btn ${key==='partner'?'selected':''}" data-profile="partner">✦ ${esc(healthProfile('partner').label)}</button></div>

function saveMeasurements(){const h=healthProfile(ui.profile),d=safeDay($('#measureDate')?.value);const weight=healthNumber($('#measureWeight')?.value);if(weight!==null&&(weight<20||weight>350)){alert('Введіть коректну вагу від 20 до 350 кг');return;}const m={};for(const [k] of BODY_PARTS){const n=healthNumber(document.querySelector(`[data-body-input="${k}"]`)?.value);if(n!==null){if(n<20||n>250){alert('Перевірте об’єм у сантиметрах');return;}m[k]=Number(n.toFixed(1));}}if(weight===null&&!Object.keys(m).length){alert('Введіть вагу або хоча б один вимір');return}if(weight!==null)h.weights[d]=Number(weight.toFixed(1));if(Object.keys(m).length)h.measurements[d]={...(h.measurements[d]||{}),...m};if(!h.schedule.extraDates.includes(d)&&!profileScheduled(ui.profile).some(x=>x.date===d))h.schedule.extraDates.push(d);save();render();}
function loadMeasurements(d){const h=healthProfile(ui.profile),date=safeDay(d||$('#measureDate')?.value),record=h.measurements[date]||{};if($('#measureDate'))$('#measureDate').value=date;if($('#measureWeight'))$('#measureWeight').value=h.weights[date]||'';for(const [k] of BODY_PARTS){const el=document.querySelector(`[data-body-input="${k}"]`);if(el)el.value=record[k]??'';}$('#measureWeight')?.focus();}
function saveHealthProfile(){const h=healthProfile(ui.profile),height=healthNumber($('#healthHeight')?.value);if(height!==null&&(height<100||height>230)){alert('Зріст має бути від 100 до 230 см');return}h.height=height??'';h.label=$('#healthLabel')?.value.trim().slice(0,30)||(ui.profile==='me'?'Я':'Чоловік');save();render()}
function saveWeighSchedule(){const h=healthProfile(ui.profile),start=$('#weighStart')?.value,interval=Number($('#weighInterval')?.value);if(!/^\d{4}-\d{2}-\d{2}$/.test(start||'')){alert('Оберіть дату');return}if(!Number.isInteger(interval)||interval<1||interval>90){alert('Інтервал має бути від 1 до 90 днів');return}h.schedule.start=start;h.schedule.interval=interval;h.schedule.overrides={};save();render()}
function moveHealthRecord(from,to){if(!/^\d{4}-\d{2}-\d{2}$/.test(to||'')||from===to)return;const h=healthProfile(ui.profile);if((h.weights[to]!==undefined||h.measurements[to])&&!confirm('На нову дату вже є виміри. Об’єднати записи?')){render();return}if(h.weights[from]!==undefined){h.weights[to]=h.weights[from];delete h.weights[from]}if(h.measurements[from]){h.measurements[to]={...(h.measurements[to]||{}),...h.measurements[from]};delete h.measurements[from]}save();render()}
function changePlannedWeight(index,date){const h=healthProfile(ui.profile);if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return;h.schedule.overrides[index]=date;save();render()}
function pageRewards(){const s=streak();return `<h2>Нагороди за серії</h2><div class="card hero"><div class="small">Найдовший страйк</div><div class="big">${s} днів</div></div>${REWARDS.map(([num,gift])=>`<div class="card rewards"><div class="rewardicon">${s>=num?'✦':'◇'}</div><div style="flex:1"><div class="row between"><b>${num} днів</b><span class="tag">${db.claimed[num]?'Отримано':s>=num?'Відкрито':'Попереду'}</span></div><input class="field" style="margin:7px 0" data-gift="${num}" value="${esc(db.gifts[num]||gift)}" maxlength="150"><div class="small">Подарунок можна замінити на власний</div>${s>=num?`<label class="check"><input type="checkbox" data-claimed="${num}" ${db.claimed[num]?'checked':''}> <span>Подарунок отримано</span></label>`:''}</div></div>`).join('')}<div class="card"><h3>Резервне копіювання</h3><div class="small">Зберігайте копію перед перевстановленням або переходом на іншу версію. Підтримується також резервна копія версії 1.0.</div><button class="btn sec" data-action="showBackup" style="margin-top:8px">Експорт / відновлення</button><div id="backupHolder"></div></div>`}

function setWeight(d,number){const n=String(number||'').replace(',','.').trim();if(n&&(!Number.isFinite(+n)||+n<20||+n>350)){alert('Введіть вагу від 20 до 350 кг');return false}if(n)db.weight[d]=Number(n).toFixed(1);else delete db.weight[d];save();return true}
function saveTask(){const p=currentPeriod(),title=$('#taskTitle').value.trim(),offset=Number($('#taskOffset').value),minutes=Number($('#taskMinutes').value),repeat=$('#taskRepeat').checked;if(!title){alert('Введіть назву справи');return}if(!Number.isInteger(offset)||offset<1||offset>p.days){alert('Оберіть день у межах періоду');return}if(!Number.isInteger(minutes)||minutes<1||minutes>480){alert('Вкажіть тривалість від 1 до 480 хв');return}
 const old=ui.taskEdit!=='new'?db.tasks.find(x=>x.id===ui.taskEdit):null;const item={...(old||{}),id:old?.id||uid(),title,offset,time:$('#taskTime').value||'10:00',minutes,repeat,singlePeriod:repeat?null:p.id,effectiveStart:old?.effectiveStart||p.start,order:old?.order??db.tasks.length};if(old)Object.assign(old,item);else db.tasks.push(item);ui.taskEdit=null;save();render()}
function persistTaskOrder(ids){const idsClean=[...new Set(ids)];let pos=0;for(const id of idsClean){const t=db.tasks.find(t=>t.id===id);if(t)t.order=pos++}for(const t of db.tasks)if(!idsClean.includes(t.id))t.order=pos++;save()}
function shiftTask(id,dir){const p=currentPeriod(),order=availableTasks(p).map(x=>x.id);const ix=order.indexOf(id),other=ix+(dir==='up'?-1:1);if(ix<0||other<0||other>=order.length)return;[order[ix],order[other]]=[order[other],order[ix]];persistTaskOrder(order);render()}
let dragInfo=null;
function startTaskDrag(e){const handle=e.target.closest('.drag-handle');if(!handle||e.button!==0)return;const row=handle.closest('.task[data-sort-id]');const list=row?.closest('.task-list');if(!row||!list)return;e.preventDefault();const rect=row.getBoundingClientRect();dragInfo={pointer:e.pointerId,start:e.clientY,row,list,moved:false};handle.setPointerCapture?.(e.pointerId);row.classList.add('task-drag-active')}
function moveTaskDrag(e){const x=dragInfo;if(!x||x.pointer!==e.pointerId)return;e.preventDefault();if(Math.abs(e.clientY-x.start)>7)x.moved=true;
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.task[data-sort-id]');if(!x.moved||!target||target===x.row||target.parentElement!==x.list)return;
 const midpoint=target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;x.list.insertBefore(x.row,e.clientY>midpoint?target.nextSibling:target);
}
function finishTaskDrag(e){const x=dragInfo;if(!x||x.pointer!==e.pointerId)return;dragInfo=null;x.row.classList.remove('task-drag-active');if(x.moved){persistTaskOrder([...x.list.querySelectorAll('.task[data-sort-id]')].map(row=>row.dataset.sortId));render()}}
async function pictureFromFile(file){if(!file||!file.type.startsWith('image/'))throw Error('Оберіть зображення.');if(file.size>12*1024*1024)throw Error('Фото завелике (максимум 12 МБ).');
 const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const factor=Math.min(1,500/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*factor));c.height=Math.max(1,Math.round(img.height*factor));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const encoded=c.toDataURL('image/webp',.70);if(encoded.length>700000)throw Error('Не вдалося стиснути фото.');return encoded;}finally{URL.revokeObjectURL(url)}
}

  if(el.id==='recipePortions'){ui.recipeServings=Math.max(1,Math.min(10,Number(el.value)||4));if(ui.recipeSelected)render();return}
  if(el.id==='recipeDate'){ui.date=safeDay(el.value);return}
  if(el.id==='mealPhotoInput'){
    try{readDraft();ui.draft.photo=await pictureFromFile(el.files?.[0]);const pic=$('#mealPreview');if(pic)pic.src=ui.draft.photo}catch(err){alert(err.message||'Не вдалося прочитати фото')}return;
  }

 if(el.dataset.moveHealthFrom){moveHealthRecord(el.dataset.moveHealthFrom,el.value);return}
 if(el.dataset.plannedWeight!==undefined){changePlannedWeight(el.dataset.plannedWeight,el.value);return}
 if(el.id==='measureDate'){loadMeasurements(el.value);return}
 if(el.id==='menuDate'||el.id==='shopDate'){ui.date=safeDay(el.value);ui.mealEdit=null;ui.draft=null;render();return}
 if(el.id==='periodSelect'){ui.periodId=el.value;ui.agenda=currentPeriod().start;ui.taskEdit=null;render();return}
 if(el.id==='agendaDate'){ui.agenda=safeDay(el.value);render();return}
 if(el.id==='habitDate'){ui.habitDate=safeDay(el.value);render();return}
 if(el.dataset.shop){markShop(weekStart(ui.date),el.dataset.shop,el.checked);render();return}
 if(el.dataset.complete){const p=currentPeriod(),t=availableTasks(p).find(x=>x.id===el.dataset.complete);if(t){doneTask(p,t,el.checked);render()}return}
 if(el.dataset.completionDate){const p=currentPeriod();const x=db.taskDone[p.id]?.[el.dataset.completionDate];if(x&&safeDay(el.value)<=nowDate()){x.date=safeDay(el.value);save();render()}else if(x){alert('Дата виконання не може бути в майбутньому');render()}return}
 if(el.dataset.habit){(db.habits[ui.habitDate]??={})[el.dataset.habit]=el.checked;save();render();return}
  if(el.dataset.gift){db.gifts[el.dataset.gift]=el.value;save();return}
 if(el.dataset.claimed){db.claimed[el.dataset.claimed]=el.checked;save();render();return}
});
$('#app').addEventListener('input',e=>{const el=e.target;if(el.id==='childSearch'){ui.childSearch=el.value;const node=$('#childCatalog'),age=ui.childAge||'toddler',day=ui.childDate||nowDate(),w=weekStart(day),p=childWeekPlan(age,day),list=p[Math.max(0,weekDays(w).indexOf(day))]||[],kind=ui.childFilter||'Усі',q=el.value.trim().toLowerCase();if(node)node.innerHTML=childActivity(age).filter(a=>(kind==='Усі'||a.kind===kind)&&(!q||[a.title,a.steps,a.material,a.why].join(' ').toLowerCase().includes(q))).map(a=>childTile(age,a.id,day,list.includes(a.id))).join('')||'<p class="small">Нічого не знайдено.</p>';return};if(el.id==='recipeSearch'){ui.recipeSearch=el.value;recipeSearchUpdate(el.value);return};if(el.dataset.gift){db.gifts[el.dataset.gift]=el.value;save()};if(el.matches('[data-product-input]'))updateSuggestions(el);if(el.id==='mealTitle'&&!ui.draft?.photo){const pic=$('#mealPreview');if(pic)pic.src=mealImage(el.value)}});
 $('#app').addEventListener('focusin',e=>{if(e.target.matches('[data-product-input]'))updateSuggestions(e.target)});
 document.addEventListener('pointerdown',e=>{if(!e.target.closest('.product-field'))closeProductSuggestions()});
 $('#app').addEventListener('pointerdown',startTaskDrag);
 $('#app').addEventListener('pointermove',moveTaskDrag);
 $('#app').addEventListener('pointerup',finishTaskDrag);
 $('#app').addEventListener('pointercancel',finishTaskDrag);

}
ensurePeriods();events();magicEvents();useMagic(selectedMagic().id,false);render();setInterval(()=>{if(ui.timerOpen&&ui.tab==='tasks')showTimerLive();if(ui.tab==='ideal'&&ui.idealTimer){const t=$('#idealTimerValue');if(t)t.textContent=idealClockText()}},1000);
