function getShopping(s){const map=new Map();const group=(it)=>{const name=String(it.name||'').trim();if(!name)return;const unit=String(it.unit||'').trim();const category=String(it.cat||'Інше');const key=name.toLocaleLowerCase('uk-UA')+'|'+unit.toLowerCase();if(!map.has(key))map.set(key,{key,name,unit,cat:category,qty:0,unspecified:false,from:0});const x=map.get(key);const qty=Number(String(it.qty??'').replace(',','.'));if(Number.isFinite(qty)&&qty>0)x.qty+=qty;else x.unspecified=true;x.from++};for(const d of weekDays(s)){for(const [k] of MEALS){const m=meal(d,k);if(!m.title.trim())continue;for(const ing of m.ingredients||[])group(ing)}}

 let ex=db.shopExtra[s]||[];if(!Array.isArray(ex))ex=[];if(Number((dateD(s)-dateD(FIRST))/86400000)>=0){const weekIdx=Math.floor((dateD(s)-dateD(FIRST))/86400000/7);if(!db.shopExtraMigrated?.[s]&&Array.isArray(db.custom[weekIdx])){ex=[...ex,...db.custom[weekIdx].map(v=>({id:uid(),name:v,qty:'',unit:'',cat:'Додатково'}))];db.shopExtra[s]=ex;(db.shopExtraMigrated??={})[s]=true;save()}}
 return base.concat(ex.map(x=>({...x,id:'manual:'+x.id,display:x.qty?x.qty+' '+(x.unit||''):'за потреби',cat:x.cat||'Додатково'})))}
function checkedShop(s,id){return !!db.shopV2[s]?.[id]}
function markShop(s,id,v){(db.shopV2[s]??={})[id]=v;save()}
function streak(habit){let best=0,n=0,d=FIRST;for(let i=0;i<3000&&d<=nowDate();i++,d=advance(d,1)){const ok=habit?!!db.habits[d]?.[habit]:HABITS.some(([id])=>db.habits[d]?.[id]);n=ok?n+1:0;best=Math.max(best,n)}return best}
function liveStreak(){let d=nowDate();if(!HABITS.some(([id])=>db.habits[d]?.[id]))d=advance(d,-1);let n=0;while(d>=FIRST&&HABITS.some(([id])=>db.habits[d]?.[id])){n++;d=advance(d,-1)}return n}
function nav(tab){ui.tab=tab;ui.mealEdit=null;ui.taskEdit=null;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){ensurePeriods();$$('nav [data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===ui.tab));const pages={menu:pageMenu,shop:pageShop,tasks:pageTasks,habits:pageHabits,weight:pageWeight,rewards:pageRewards};$('#app').innerHTML=pages[ui.tab]();if(ui.timerOpen)showTimerLive()}
function dayPicker(d){let s=weekStart(d);return `<div class="toolbar"><button class="btn line sm" data-action="prevWeek">←</button><input class="field" style="flex:1" type="date" id="menuDate" value="${esc(d)}"><button class="btn line sm" data-action="nextWeek">→</button></div><div class="days">${weekDays(s).map(x=>`<button class="day ${x===d?'sel':''}" data-day="${x}">${esc(weekday(x))}<b>${dateD(x).getDate()}</b></button>`).join('')}</div>`}
function pageMenu(){const d=ui.date;return `<div class="card hero"><div class="small">Меню на дату</div><div class="big">${fmt(d)}</div><div class="muted">Змінюйте страви й склад продуктів. Покупки перерахуються автоматично.</div></div>${dayPicker(d)}${ui.mealEdit?mealEditor():`<div class="card">${MEALS.map(([k,label])=>{let m=meal(d,k);return `<div class="meal"><div class="row between"><div class="small">${label} · ${esc(m.time||'—')}</div><button class="btn sec sm" data-editmeal="${k}">Редагувати</button></div><div class="name">${esc(m.title||'Страву не заплановано')}</div><div class="small">${(m.ingredients||[]).length} продуктів · ${esc((m.ingredients||[]).slice(0,3).map(x=>x.name).join(', '))}</div></div>`}).join('')}</div><div class="card"><div class="row between"><div><b>Покупки на цей тиждень</b><div class="small">З ${fmt(weekStart(d))}</div></div><button class="btn sec" data-goto="shop">Відкрити →</button></div></div>`}<div class="hint">Початкові кількості продуктів — приблизні. Ви можете змінити кожен інгредієнт, додати новий або залишити поле кількості порожнім. Дитячі порції не потрібно обмежувати за дорослим планом.</div>`}
function mealEditor(){const d=ui.date,k=ui.mealEdit;const title=MEALS.find(x=>x[0]===k)?.[1];const original=meal(d,k);if(!ui.draft)ui.draft=structuredClone(original);const m=ui.draft;return `<div class="card focus"><div class="row between"><h3>${esc(title)} · редагування</h3><button class="btn line sm" data-action="cancelMeal">Закрити</button></div><div class="stack"><div class="input-group"><label>Назва страви</label><input id="mealTitle" class="field" maxlength="180" value="${esc(m.title)}" placeholder="Що будете їсти?"></div><div class="input-group"><label>Час прийому їжі</label><input id="mealTime" type="time" class="field" value="${esc(m.time)}"></div></div><hr class="divider"><h3>Продукти для цієї страви</h3><div class="small">Саме з цього переліку формується список покупок.</div><div id="ingredientRows">${(m.ingredients||[]).map((i,n)=>`<div class="card" style="padding:10px" data-ing="${n}"><div class="row between"><b class="small">Продукт ${n+1}</b><button class="btn red sm" data-action="removeIng" data-index="${n}">Видалити</button></div><div class="ingredient"><input class="field iname" aria-label="Назва продукту" placeholder="Продукт" maxlength="90" value="${esc(i.name)}"><input class="field iqty" aria-label="Кількість" inputmode="decimal" type="number" step="0.1" min="0" placeholder="К-ть" value="${esc(i.qty)}"><input class="field iunit" aria-label="Одиниця" maxlength="12" value="${esc(i.unit)}"><input class="field icat wide" aria-label="Категорія" maxlength="40" placeholder="Категорія" value="${esc(i.cat||'Інше')}"></div></div>`).join('')}</div><div class="toolbar"><button class="btn sec sm" data-action="addIng">+ Додати продукт</button><button class="btn line sm" data-action="reguess">Підібрати за назвою</button></div><div class="warn">Якщо змінити назву й не чіпати інгредієнти, програма запропонує новий список автоматично. Для ручного оновлення є кнопка «Підібрати за назвою». Обов’язково перевірте склад і кількість.</div><div class="toolbar"><button class="btn" data-action="saveMeal">Зберегти страву</button><button class="btn line" data-action="resetMeal">Повернути початкову</button></div></div>`}
function readDraft(){const m=ui.draft||{};m.title=$('#mealTitle')?.value??m.title;m.time=$('#mealTime')?.value??m.time;m.ingredients=$$('#ingredientRows [data-ing]').map(row=>({name:row.querySelector('.iname').value.trim(),qty:row.querySelector('.iqty').value.trim(),unit:row.querySelector('.iunit').value.trim(),cat:row.querySelector('.icat').value.trim()||'Інше'}));ui.draft=m}
function pageShop(){const s=weekStart(ui.date),items=getShopping(s),done=items.filter(x=>checkedShop(s,x.id)).length;const cats=[...new Set(items.map(x=>x.cat))];return `<h2>Покупки за меню</h2><div class="card hero"><div class="small">Тиждень ${fmt(s)} — ${fmt(advance(s,6))}</div><div class="big">${done} / ${items.length} куплено</div><div class="progress"><div style="width:${items.length?done*100/items.length:0}%"></div></div></div><div class="toolbar"><button class="btn line sm" data-action="prevWeek">←</button><input class="field" type="date" id="shopDate" value="${esc(ui.date)}"><button class="btn line sm" data-action="nextWeek">→</button><button class="btn sec sm" data-action="resetShop">Скинути галочки</button></div><div class="hint">Список автоматично складається з інгредієнтів усіх страв тижня. Однакові продукти з однаковими одиницями підсумовуються. Для інших рецептів відкрийте «Меню» й уточніть їхній склад.</div>${cats.map(cat=>`<div class="card"><h3>${esc(cat)}</h3>${items.filter(x=>x.cat===cat).map(x=>`<div class="check"><input type="checkbox" id="shop-${esc(encodeURIComponent(x.id))}" data-shop="${esc(x.id)}" ${checkedShop(s,x.id)?'checked':''}><label for="shop-${esc(encodeURIComponent(x.id))}" class="${checkedShop(s,x.id)?'done':''}"><b>${esc(x.name)}</b><span class="small" style="display:block">${esc(x.display)}</span></label>${x.id.startsWith('manual:')?`<button class="btn red sm" data-action="removeShop" data-manual="${esc(x.id.slice(7))}">×</button>`:''}</div>`).join('')}</div>`).join('')}${!items.length?'<div class="card">Поки немає продуктів. Додайте інгредієнти у меню.</div>':''}<div class="card"><h3>Додати покупку вручну</h3><div class="stack"><input id="manualName" class="field" placeholder="Назва продукту" maxlength="100"><div class="input-row"><input id="manualQty" class="field" placeholder="Кількість (за бажанням)" inputmode="decimal"><input id="manualUnit" class="field" placeholder="г, кг, шт, л..."></div><button class="btn" data-action="addShop">+ До покупок</button></div></div>`}
function pageTasks(){const p=currentPeriod(),ends=periodEnd(p);const tasks=availableTasks(p);const completedCount=tasks.filter(t=>completed(p,t)).length;const current=activePeriod();return `<h2>Справи та таймінг</h2><div class="card hero"><div class="small">Поточна папка справ</div><div class="big">${esc(p.name)}</div><div>${fmtFull(p.start)} — ${fmtFull(ends)} · ${p.days} днів</div><div class="small">Виконано ${completedCount} із ${tasks.length} завдань</div><div class="progress" style="margin-top:9px"><div style="width:${tasks.length?completedCount*100/tasks.length:0}%"></div></div></div><div class="card"><div class="input-group"><label>Переглянути період або історію</label><select class="field" id="periodSelect">${db.periods.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)} · ${fmt(x.start)} — ${fmt(periodEnd(x))}</option>`).join('')}</select></div><div class="toolbar"><button class="btn sec sm" data-action="currentPeriod">Поточний період</button><button class="btn line sm" data-action="newPeriod">Почати наступну папку</button></div><hr class="divider"><div class="input-row"><div class="input-group"><label>Тривалість наступного періоду (днів)</label><input class="field" type="number" id="periodLength" min="1" max="90" step="1" value="${esc(db.nextPeriodDays)}"></div><div class="input-group"><label>Назва поточного періоду</label><input class="field" type="text" id="periodName" maxlength="70" value="${esc(p.name)}"></div></div><div class="toolbar"><button class="btn sec sm" data-action="savePeriod">Зберегти налаштування</button>${p.id===db.periods.at(-1).id?`<button class="btn line sm" data-action="changeCurrentDays">Змінити тривалість цієї папки</button>`:''}</div><div class="small">Коли період закінчується, створюється наступний; виконання в минулих папках зберігаються.</div></div><div class="tabline"><button class="btn ${ui.taskMode==='period'?'':'sec'}" data-taskmode="period">Список справ</button><button class="btn ${ui.taskMode==='agenda'?'':'sec'}" data-taskmode="agenda">Розклад за часом</button></div>${ui.taskEdit!==null?taskEditor(p):ui.taskMode==='agenda'?agendaView(p):taskList(p,tasks)}${timerUI()}`}
function taskList(p,tasks){return `<div class="card"><div class="row between"><h3>Завдання у папці</h3><button class="btn sm" data-action="newTask">+ Справа</button></div>${tasks.length?tasks.map(t=>taskRow(p,t)).join(''):'<p class="small">Справ поки немає. Створіть свою — вона може повторюватися в кожному новому періоді.</p>'}<div class="chips"><button class="btn line sm" data-sample="Придбати продукти">+ Покупки</button><button class="btn line sm" data-sample="Прибирання">+ Прибирання</button><button class="btn line sm" data-sample="Навчання">+ Навчання</button></div></div>`}
function taskRow(p,t){const c=completed(p,t);return `<div class="task"><div class="row between"><div class="row" style="flex:1;min-width:0"><input type="checkbox" style="width:23px;height:23px;accent-color:var(--purple)" id="task-${esc(t.id)}" data-complete="${esc(t.id)}" ${c?'checked':''}><label for="task-${esc(t.id)}" class="${c?'done':''}" style="flex:1;min-width:0"><div class="task-title">${esc(t.title)}</div><div class="small">${fmt(scheduledDay(p,t))} · ${esc(t.time||'без часу')} · ${Number(t.minutes)||25} хв ${t.repeat?'· повторюється':''}</div></label></div><button class="btn sec sm" data-edittask="${esc(t.id)}">✎</button></div>${c?`<div class="task-date" style="margin:8px 0 0 31px">Виконано ${fmt(c.date)} о ${esc(c.time||'—')}</div><div class="toolbar" style="margin-left:31px"><label class="small">Виправити дату: </label><input aria-label="Дата виконання" type="date" class="field" style="max-width:170px" data-completion-date="${esc(t.id)}" value="${esc(c.date)}"></div>`:`<div class="toolbar" style="margin-left:31px"><button class="btn line sm" data-action="timerTask" data-task="${esc(t.id)}">Таймер ${Number(t.minutes)||25} хв</button></div>`}</div>`}
function taskEditor(p){const isNew=ui.taskEdit==='new';let t=isNew?{id:'',title:'',offset:1,time:'10:00',minutes:25,repeat:true}:db.tasks.find(x=>x.id===ui.taskEdit);if(!t)return '';return `<div class="card focus"><h3>${isNew?'Нова справа':'Редагувати справу'}</h3><div class="stack"><div class="input-group"><label>Назва</label><input class="field" id="taskTitle" maxlength="140" value="${esc(t.title)}" placeholder="Наприклад, пропилососити"></div><div class="input-row"><div class="input-group"><label>День у періоді (1–${p.days})</label><input id="taskOffset" class="field" type="number" min="1" max="${p.days}" value="${Math.min(Number(t.offset)||1,p.days)}"></div><div class="input-group"><label>Час</label><input id="taskTime" type="time" class="field" value="${esc(t.time||'10:00')}"></div></div><div class="input-group"><label>Тривалість, хвилин</label><input id="taskMinutes" class="field" type="number" min="1" max="480" value="${Number(t.minutes)||25}"></div><label class="check"><input type="checkbox" id="taskRepeat" ${t.repeat?'checked':''}><span>Повторювати в кожному новому періоді</span></label><div class="toolbar"><button class="btn" data-action="saveTask">Зберегти</button><button class="btn line" data-action="cancelTask">Скасувати</button>${!isNew?'<button class="btn red" data-action="deleteTask">Видалити</button>':''}</div></div></div>`}
function agendaView(p){if(ui.agenda<p.start||ui.agenda>periodEnd(p))ui.agenda=p.start;const d=ui.agenda;const items=[];for(const [k,label] of MEALS){const m=meal(d,k);if(m.title)items.push({time:m.time||'12:00',type:'meal',label,title:m.title})}for(const t of availableTasks(p))if(scheduledDay(p,t)===d)items.push({time:t.time||'23:59',type:'task',t,title:t.title,label:'Справа · '+(Number(t.minutes)||25)+' хв'});items.sort((a,b)=>a.time.localeCompare(b.time));return `<div class="card"><h3>Розклад на день</h3><input class="field" id="agendaDate" type="date" min="${p.start}" max="${periodEnd(p)}" value="${d}"><div class="small" style="margin:9px 0">Час і тривалість можна змінювати в редакторі страви або справи.</div>${items.length?items.map(x=>`<div class="schedule time ${x.type==='task'&&completed(p,x.t)?'finished':''}"><div class="small">${esc(x.time)} · ${esc(x.label)}</div><div class="row between"><b>${esc(x.title)}</b>${x.type==='task'?`<input type="checkbox" aria-label="Виконано" data-complete="${esc(x.t.id)}" ${completed(p,x.t)?'checked':''} style="width:22px;height:22px;accent-color:var(--purple)">`:''}</div>${x.type==='task'&&completed(p,x.t)?`<div class="task-date">Виконано ${fmt(completed(p,x.t).date)}</div>`:''}</div>`).join(''):'<p class="small">На цей день немає записів.</p>'}</div>`}
function timerUI(){if(!db.timer||!ui.timerOpen)return '';let remaining=db.timer.endsAt?Math.max(0,Math.ceil((db.timer.endsAt-Date.now())/1000)):db.timer.remaining;return `<div class="card focus"><div class="small">Таймер справи</div><div class="big timer-digit" id="timerDigit">${formatSeconds(remaining)}</div><div class="small">${esc(db.timer.title)}</div><div class="toolbar"><button class="btn sec" data-action="timerToggle">${db.timer.endsAt?'Пауза':'Продовжити'}</button><button class="btn line" data-action="timerStop">Закрити таймер</button></div></div>`}
function formatSeconds(s){const n=Math.max(0,Math.ceil(s||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function showTimerLive(){const el=$('#timerDigit');if(!el||!db.timer)return;const remaining=db.timer.endsAt?Math.max(0,Math.ceil((db.timer.endsAt-Date.now())/1000)):db.timer.remaining;el.textContent=formatSeconds(remaining);if(!remaining&&db.timer.endsAt){db.timer.endsAt=null;db.timer.remaining=0;save()}}
function pageHabits(){const d=ui.habitDate;const e=db.habits[d]||{};return `<h2>Звички</h2><div class="card hero"><div class="small">Поточна серія</div><div class="big">${liveStreak()} днів</div><div class="small">Достатньо хоча б однієї звички за день</div></div><div class="card"><div class="input-group"><label>Дата</label><input class="field" type="date" id="habitDate" value="${esc(d)}"></div>${HABITS.map(([id,title,desc])=>`<div class="check"><input type="checkbox" id="habit-${id}" data-habit="${id}" ${e[id]?'checked':''}><label for="habit-${id}" class="${e[id]?'done':''}"><b>${title}</b><span class="small" style="display:block">${desc}</span></label></div>`).join('')}</div><div class="grid2">${HABITS.map(([id,title])=>`<div class="stat"><span class="small">${title}</span><b>${streak(id)} дн.</b><span class="small">Найдовша серія</span></div>`).join('')}</div><div class="hint">Дні відпочинку та відновлення необхідні. Не тренуйтеся через біль у стопі або суглобах.</div>`}
function weighDates(){let d=FIRST_WEIGH;let end=nowDate()>LAST?nowDate():LAST;let arr=[];for(let i=0;i<1000&&d<=end;i++,d=advance(d,7))arr.push(d);if(!arr.includes(LAST))arr.push(LAST);return [...new Set([...arr,...Object.keys(db.weight)])].sort()}
function pageWeight(){const entries=Object.entries(db.weight).filter(([d,v])=>Number(v)>0).sort((a,b)=>a[0].localeCompare(b[0]));let diff=entries.length>1?Number(entries.at(-1)[1])-Number(entries[0][1]):null;return `<h2>Трекер ваги</h2><div class="card hero"><div class="big">Щотижня</div><div>Перше зважування 25 жовтня 2026 року; далі у неділю, за потреби можете змінити дату.</div></div><div class="grid2"><div class="stat"><span class="small">Зважувань</span><b>${entries.length}</b></div><div class="stat"><span class="small">Різниця від першого</span><b>${diff===null?'—':(diff>0?'+':'')+diff.toFixed(1)+' кг'}</b></div></div><div class="card"><h3>Записи ваги</h3>${weighDates().map(d=>`<div class="check"><span style="flex:1">${fmtFull(d)}</span><input class="field" style="width:110px;flex:0 0 110px" type="number" inputmode="decimal" step="0.1" min="20" max="350" placeholder="кг" data-weight="${d}" value="${esc(db.weight[d]||'')}"></div>`).join('')}</div><div class="card"><h3>Додати іншу дату</h3><div class="input-row"><input class="field" type="date" id="extraWeightDate" value="${nowDate()}"><input class="field" type="number" step="0.1" id="extraWeight" placeholder="кг"></div><button class="btn" style="margin-top:8px" data-action="extraWeight">Зберегти</button></div><div class="hint">Добові коливання нормальні. Оцінюйте тенденцію за кілька тижнів, а не окреме число.</div>`}
function pageRewards(){const s=streak();return `<h2>Нагороди за серії</h2><div class="card hero"><div class="small">Найдовший страйк</div><div class="big">${s} днів</div></div>${REWARDS.map(([num,gift])=>`<div class="card rewards"><div class="rewardicon">${s>=num?'✦':'◇'}</div><div style="flex:1"><div class="row between"><b>${num} днів</b><span class="tag">${db.claimed[num]?'Отримано':s>=num?'Відкрито':'Попереду'}</span></div><input class="field" style="margin:7px 0" data-gift="${num}" value="${esc(db.gifts[num]||gift)}" maxlength="150"><div class="small">Подарунок можна замінити на власний</div>${s>=num?`<label class="check"><input type="checkbox" data-claimed="${num}" ${db.claimed[num]?'checked':''}> <span>Подарунок отримано</span></label>`:''}</div></div>`).join('')}<div class="card"><h3>Резервне копіювання</h3><div class="small">Зберігайте копію перед перевстановленням або переходом на іншу версію. Підтримується також резервна копія версії 1.0.</div><button class="btn sec" data-action="showBackup" style="margin-top:8px">Експорт / відновлення</button><div id="backupHolder"></div></div>`}
function showBackup(){const x=$('#backupHolder');if(x)x.innerHTML=`<textarea class="field" id="backup" rows="7" style="margin-top:8px">${esc(JSON.stringify(db))}</textarea><div class="toolbar"><button class="btn sec" data-action="copyBackup">Копіювати</button><button class="btn line" data-action="restore">Відновити з поля</button></div>`}
function setWeight(d,number){const n=String(number||'').replace(',','.').trim();if(n&&(!Number.isFinite(+n)||+n<20||+n>350)){alert('Введіть вагу від 20 до 350 кг');return false}if(n)db.weight[d]=Number(n).toFixed(1);else delete db.weight[d];save();return true}
function saveTask(){const p=currentPeriod(),title=$('#taskTitle').value.trim(),offset=Number($('#taskOffset').value),minutes=Number($('#taskMinutes').value),repeat=$('#taskRepeat').checked;if(!title){alert('Введіть назву справи');return}if(!Number.isInteger(offset)||offset<1||offset>p.days){alert('Оберіть день у межах періоду');return}if(!Number.isInteger(minutes)||minutes<1||minutes>480){alert('Вкажіть тривалість від 1 до 480 хв');return}
 const old=ui.taskEdit!=='new'?db.tasks.find(x=>x.id===ui.taskEdit):null;const item={...(old||{}),id:old?.id||uid(),title,offset,time:$('#taskTime').value||'10:00',minutes,repeat,singlePeriod:repeat?null:p.id,effectiveStart:old?.effectiveStart||p.start};if(old)Object.assign(old,item);else db.tasks.push(item);ui.taskEdit=null;save();render()}
function events(){document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)nav(b.dataset.tab)});
$('#app').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.goto){nav(b.dataset.goto);return}
 if(b.dataset.day){ui.date=b.dataset.day;ui.mealEdit=null;ui.draft=null;render();return}
 if(b.dataset.editmeal){ui.mealEdit=b.dataset.editmeal;ui.draft=null;render();return}
 if(b.dataset.taskmode){ui.taskMode=b.dataset.taskmode;ui.taskEdit=null;render();return}
 if(b.dataset.edittask){ui.taskEdit=b.dataset.edittask;render();return}
 if(b.dataset.sample){const p=currentPeriod();db.tasks.push({id:uid(),title:b.dataset.sample,offset:1,time:'10:00',minutes:25,repeat:true,effectiveStart:p.start});save();render();return}
 const a=b.dataset.action;if(!a)return;
 if(a==='prevWeek'||a==='nextWeek'){ui.date=advance(ui.date,a==='prevWeek'?-7:7);ui.mealEdit=null;ui.draft=null;render();return}
 if(a==='cancelMeal'){ui.mealEdit=null;ui.draft=null;render();return}
 if(a==='addIng'){readDraft();ui.draft.ingredients.push({name:'',qty:'',unit:'г',cat:'Інше'});render();return}
 if(a==='removeIng'){readDraft();ui.draft.ingredients.splice(Number(b.dataset.index),1);render();return}
 if(a==='reguess'){readDraft();if(!confirm('Замінити список інгредієнтів підказками з назви страви?'))return;ui.draft.ingredients=guessIngredients(ui.draft.title);render();return}
 if(a==='saveMeal'){readDraft();const k=ui.mealEdit,m=ui.draft;const original=meal(ui.date,k);const sign=arr=>(arr||[]).map(i=>[String(i.name||''),String(i.qty??''),String(i.unit||''),String(i.cat||'Інше')]);if(m.title!==original.title&&JSON.stringify(sign(m.ingredients))===JSON.stringify(sign(original.ingredients)))m.ingredients=guessIngredients(m.title);m.ingredients=m.ingredients.filter(i=>i.name.trim());if(!db.mealEdits[ui.date])db.mealEdits[ui.date]={};db.mealEdits[ui.date][k]=structuredClone(m);ui.mealEdit=null;ui.draft=null;save();render();return}
 if(a==='resetMeal'){if(confirm('Повернути початкову страву та продукти?')){delete db.mealEdits[ui.date]?.[ui.mealEdit];ui.mealEdit=null;ui.draft=null;save();render()}return}
 if(a==='resetShop'){const s=weekStart(ui.date);if(confirm('Скинути позначки покупок за цей тиждень?')){db.shopV2[s]={};save();render()}return}
 if(a==='addShop'){const name=$('#manualName').value.trim();if(!name){alert('Вкажіть продукт');return}const s=weekStart(ui.date);(db.shopExtra[s]??=[]).push({id:uid(),name,qty:$('#manualQty').value.trim(),unit:$('#manualUnit').value.trim(),cat:'Додатково'});save();render();return}
 if(a==='removeShop'){const s=weekStart(ui.date);if(confirm('Прибрати додаткову покупку?')){db.shopExtra[s]=(db.shopExtra[s]||[]).filter(x=>x.id!==b.dataset.manual);save();render()}return}
 if(a==='currentPeriod'){ui.periodId=activePeriod().id;ui.agenda=activePeriod().start;render();return}
 if(a==='savePeriod'){const days=Number($('#periodLength').value);if(!Number.isInteger(days)||days<1||days>90){alert('Вкажіть 1–90 днів');return}db.nextPeriodDays=days;currentPeriod().name=$('#periodName').value.trim()||'Мій період';save();render();return}
 if(a==='changeCurrentDays'){const p=currentPeriod();if(p.id!==db.periods.at(-1).id)return;const days=Number($('#periodLength').value);if(!Number.isInteger(days)||days<1||days>90){alert('Вкажіть 1–90 днів');return}if(periodEnd({...p,days})<nowDate()&&!confirm('Поточний період завершиться в минулому й відразу створиться новий. Продовжити?'))return;p.days=days;db.nextPeriodDays=days;save();render();return}
 if(a==='newPeriod'){const last=db.periods.at(-1);const next=advance(periodEnd(last),1);const days=Number($('#periodLength').value);if(!Number.isInteger(days)||days<1||days>90){alert('Вкажіть 1–90 днів');return}db.nextPeriodDays=days;const p={id:'p-'+next,start:next,days,name:`Період ${db.periods.length+1}`};db.periods.push(p);ui.periodId=p.id;ui.agenda=p.start;save();render();return}
 if(a==='newTask'){ui.taskEdit='new';render();return}
 if(a==='cancelTask'){ui.taskEdit=null;render();return}
 if(a==='saveTask'){saveTask();return}
 if(a==='deleteTask'){const t=db.tasks.find(t=>t.id===ui.taskEdit);if(!t)return;if(confirm('Видалити цю справу з майбутніх періодів? Історія відміток залишиться в резервній копії.')){t.deleted=true;ui.taskEdit=null;save();render()}return}
 if(a==='timerTask'){const p=currentPeriod();const t=availableTasks(p).find(x=>x.id===b.dataset.task);if(!t)return;db.timer={title:t.title,task:t.id,period:p.id,remaining:t.minutes*60,endsAt:Date.now()+t.minutes*60000};ui.timerOpen=true;save();render();return}
 if(a==='timerToggle'){if(!db.timer)return;if(db.timer.endsAt){db.timer.remaining=Math.max(0,Math.ceil((db.timer.endsAt-Date.now())/1000));db.timer.endsAt=null}else db.timer.endsAt=Date.now()+db.timer.remaining*1000;save();render();return}
 if(a==='timerStop'){db.timer=null;ui.timerOpen=false;save();render();return}
 if(a==='extraWeight'){if(setWeight($('#extraWeightDate').value,$('#extraWeight').value))render();return}
 if(a==='showBackup'){showBackup();return}
 if(a==='copyBackup'){const t=$('#backup');if(!t)return;t.select();try{await navigator.clipboard.writeText(t.value);alert('Скопійовано')}catch(e){document.execCommand('copy');alert('Скопіюйте виділений текст')}return}
 if(a==='restore'){try{const x=JSON.parse($('#backup').value);if(!x||typeof x!=='object'||Array.isArray(x))throw new Error();if(confirm('Замінити всі поточні записи резервною копією?')){db=x;for(const k of ['shop','custom','habits','weight','claimed','gifts','mealEdits','shopV2','shopExtra','taskDone'])if(!db[k]||typeof db[k]!=='object')db[k]={};if(!Array.isArray(db.tasks))db.tasks=[];if(!Array.isArray(db.periods)||!db.periods.length)db.periods=[{id:'p-2026-10-19',start:FIRST,days:7,name:'Тиждень 1'}];db.nextPeriodDays=Number(db.nextPeriodDays)||7;ui.periodId=null;save();render()}}catch(e){alert('Невірна резервна копія')}return}
});
$('#app').addEventListener('change',e=>{const el=e.target;
 if(el.id==='menuDate'||el.id==='shopDate'){ui.date=safeDay(el.value);ui.mealEdit=null;ui.draft=null;render();return}
 if(el.id==='periodSelect'){ui.periodId=el.value;ui.agenda=currentPeriod().start;ui.taskEdit=null;render();return}
 if(el.id==='agendaDate'){ui.agenda=safeDay(el.value);render();return}
 if(el.id==='habitDate'){ui.habitDate=safeDay(el.value);render();return}
 if(el.dataset.shop){markShop(weekStart(ui.date),el.dataset.shop,el.checked);render();return}
 if(el.dataset.complete){const p=currentPeriod(),t=availableTasks(p).find(x=>x.id===el.dataset.complete);if(t){doneTask(p,t,el.checked);render()}return}
 if(el.dataset.completionDate){const p=currentPeriod();const x=db.taskDone[p.id]?.[el.dataset.completionDate];if(x&&safeDay(el.value)<=nowDate()){x.date=safeDay(el.value);save();render()}else if(x){alert('Дата виконання не може бути в майбутньому');render()}return}
 if(el.dataset.habit){(db.habits[ui.habitDate]??={})[el.dataset.habit]=el.checked;save();render();return}
 if(el.dataset.weight){if(setWeight(el.dataset.weight,el.value))render();return}
 if(el.dataset.gift){db.gifts[el.dataset.gift]=el.value;save();return}
 if(el.dataset.claimed){db.claimed[el.dataset.claimed]=el.checked;save();render();return}
});
$('#app').addEventListener('input',e=>{const el=e.target;if(el.dataset.gift){db.gifts[el.dataset.gift]=el.value;save()}});
}
ensurePeriods();events();render();setInterval(()=>{if(ui.timerOpen&&ui.tab==='tasks')showTimerLive()},1000);

</script></body></html>
