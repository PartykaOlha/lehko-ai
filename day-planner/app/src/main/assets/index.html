<body><div class="aurora one"></div><div class="aurora two"></div><div class="shell">
<header class="topbar"><div class="brand"><div class="mark">AD</div><div><small>YOUR DAILY SPACE</small><strong>Atelier Day</strong></div></div><button class="round-btn" data-action="settings" aria-label="Налаштування" title="Налаштування"><svg viewBox="0 0 24 24"><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg></button></header>
<section class="hero"><div class="eyebrow"><span class="diamond"></span>PEARL GLASS · МІЙ ЩОДЕННИК</div><h1>Мій день.<em>Мої правила.</em></h1><p>Плани, важливі справи й маленькі перемоги — в одному красивому просторі.</p><div class="hero-footer"><span class="hero-pill" id="hero-date">Сьогодні</span><span class="hero-pill" id="hero-progress">0 справ виконано</span></div></section>
<main id="main" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="Навігація"><button data-tab="day" class="nav-btn active"><svg viewBox="0 0 24 24"><path d="M8 3h8m-8 0v3m8-3v3M5 6h14v15H5zM9 11h6m-6 4h6"/></svg>Мій день</button><button data-tab="calendar" class="nav-btn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>Календар</button><button data-action="new-task" class="nav-btn add-center" aria-label="Додати нову справу"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Додати</button><button data-tab="habits" class="nav-btn"><svg viewBox="0 0 24 24"><path d="m12 3 2.5 5.8L21 10l-4.7 4.2L17.7 21 12 17.7 6.3 21l1.4-6.8L3 10l6.5-1.2L12 3z"/></svg>Ритуали</button><button data-tab="journal" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M4 4h15v16H6a2 2 0 0 1-2-2V4zm0 14a2 2 0 0 1 2-2h13M8 8h7m-7 4h7"/></svg>Нотатки</button></nav>
<div class="overlay" id="modal" aria-hidden="true"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{
'use strict';
const KEY='atelier.daybook.pearlglass.v1';
const cats={work:{name:'Робота',mark:'◇'},family:{name:'Сім’я',mark:'♡'},home:{name:'Дім',mark:'⌂'},self:{name:'Для себе',mark:'✧'},learn:{name:'Навчання',mark:'◈'},other:{name:'Інше',mark:'·'}};
const moods={calm:{name:'Спокійно',icon:'☼'},busy:{name:'Насичено',icon:'✦'},good:{name:'Натхненно',icon:'♡'}};
const fmt=new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long'});
const fmtMonth=new Intl.DateTimeFormat('uk-UA',{month:'long',year:'numeric'});
const todayISO=()=>iso(new Date());
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function date(s){return new Date(s+'T12:00:00')}
function add(s,n){const d=date(s);d.setDate(d.getDate()+n);return iso(d)}
function monday(s){const d=date(s);const w=(d.getDay()+6)%7;return add(s,-w)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function firstUpper(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tasks)&&x.days&&x.settings)return x}catch(e){}return {tasks:[],days:{},settings:{reminders:false}}}
let data=load(),selected=todayISO(),tab='day',filter='all',monthCursor=selected.slice(0,7)+'-01',calendarSearch='',toastT;
const $=id=>document.getElementById(id);
function store(sync=true){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Не вдалося зберегти дані')}if(sync)syncNative()}
function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2700)}
function isOccur(t,s){if(s<t.date)return false;if((t.excluded||[]).includes(s))return false;if(t.repeat==='daily')return true;if(t.repeat==='weekdays')return [1,2,3,4,5].includes(date(s).getDay());if(t.repeat==='weekly')return date(t.date).getDay()===date(s).getDay();return t.date===s}
function onDay(s){return data.tasks.filter(t=>isOccur(t,s)).sort((a,b)=>(a.done?.[s]?1:0)-(b.done?.[s]?1:0)||String(a.time||'99:99').localeCompare(b.time||'99:99')||(b.priority==='high')-(a.priority==='high')||a.title.localeCompare(b.title,'uk'))}
function done(t,s){return Boolean(t.done?.[s])}
function stats(s){let a=onDay(s);return {total:a.length,done:a.filter(t=>done(t,s)).length}}
function dayRecord(s){return data.days[s]||(data.days[s]={note:'',mood:''})}
function icon(n){const paths={plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',star:'<path d="m12 3 2.5 6L21 10l-5 4 1.3 7L12 18l-5.3 3L8 14l-5-4 6.5-1z"/>',edit:'<path d="M13 5l6 6M4 20l4.5-1 11-11a2 2 0 0 0-5-5l-11 11L4 20z"/>',trash:'<path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/>',repeat:'<path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2m-3.7-7.3-1.5 1.5M7.2 16.8l-1.5 1.5m0-13.6 1.5 1.5m9.6 10.6 1.5 1.5"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" aria-hidden="true">${paths[n]||paths.star}</svg>`}
function dateRail(){const start=monday(selected);let s=`<div class="datebar"><strong class="month-title">${firstUpper(fmtMonth.format(date(selected)))}</strong><div class="date-controls"><button class="small-circle" data-action="prev-week" aria-label="Попередній тиждень">${icon('back')}</button><button class="small-circle" data-action="today" aria-label="Повернутися до сьогодні">${icon('sun')}</button><button class="small-circle" data-action="next-week" aria-label="Наступний тиждень">${icon('chev')}</button></div></div><div class="date-strip">`;
for(let i=0;i<7;i++){const d=add(start,i),o=date(d);s+=`<button class="day-pill ${selected===d?'selected':''} ${todayISO()===d?'today':''}" data-action="select-date" data-date="${d}" aria-label="${esc(fmt.format(o))}" aria-pressed="${selected===d}"><span>${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'][i]}</span><strong>${o.getDate()}</strong></button>`}return s+'</div>'}
function taskCard(t,s){return `<div class="task ${done(t,s)?'done':''}"><input type="checkbox" class="task-check" aria-label="Виконано: ${esc(t.title)}" data-action="done-task" data-id="${esc(t.id)}" ${done(t,s)?'checked':''}/><div><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="task-tag">${esc(cats[t.category]?.name||'Інше')}</span>${t.time?`<span class="task-time">${esc(t.time)}</span>`:''}${t.repeat!=='none'?`<span class="task-time">↻</span>`:''}${t.priority==='high'?`<span class="task-priority">Важливо</span>`:''}</div>${t.note?`<div class="task-note">${esc(t.note)}</div>`:''}</div><button class="task-edit" aria-label="Редагувати ${esc(t.title)}" data-action="edit-task" data-id="${esc(t.id)}">${icon('chev')}</button></div>`}
function renderDay(){const s=stats(selected),p=s.total?Math.round(s.done/s.total*100):0;const tasks=onDay(selected).filter(t=>filter==='done'?done(t,selected):filter==='open'?!done(t,selected):true);const moment=selected===todayISO()?'Сьогодні':firstUpper(fmt.format(date(selected)));const top=`${dateRail()}<div class="title-row"><div><div class="section-kicker">THE DAILY EDIT</div><h2>${moment} · Мої справи</h2></div><button class="link-btn" data-action="new-task">+ Додати</button></div><div class="progress-card"><div class="progress-ring" style="--p:${p}%"><span>${p}%</span></div><div class="progress-copy"><strong>Твій прогрес на день</strong><span>${s.total?`Виконано <b>${s.done} із ${s.total}</b> справ. ${p===100?'Усе заплановане завершено!':'Твій ритм — твій вибір.'}`:'Тут з’явиться прогрес, коли додаси справи.'}</span></div></div><div class="quick-actions"><button class="chip ${filter==='all'?'active':''}" data-action="filter" data-value="all">Усі справи</button><button class="chip ${filter==='open'?'active':''}" data-action="filter" data-value="open">У плані</button><button class="chip ${filter==='done'?'active':''}" data-action="filter" data-value="done">Виконані</button></div>`;
const list=tasks.length?`<div class="tasks">${tasks.map(t=>taskCard(t,selected)).join('')}</div>`:`<div class="empty"><div class="empty-art">✧</div><strong>${filter==='all'?'Чистий аркуш для нового дня':'Тут поки немає справ'}</strong><p>${filter==='all'?'Додай одну важливу справу. Решту можна запланувати пізніше.':'Обери інший фільтр або додай нове завдання.'}</p><button class="btn btn-primary" data-action="new-task">+ Нова справа</button></div>`;
const first=onDay(selected).find(t=>!done(t,selected)&&t.priority==='high')||onDay(selected).find(t=>!done(t,selected));return top+list+(first?`<div class="focus-card"><div><div class="sub">МІЙ ФОКУС</div><strong>${esc(first.title)}</strong><p>${first.priority==='high'?'Найважливіша справа у твоєму плані':'Одна справа за раз — цього достатньо'}</p></div><div class="focus-mark">✦</div></div>`:'')}
function renderCalendar(){const d=date(monthCursor),year=d.getFullYear(),month=d.getMonth(),startOffset=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();let cal=`<div class="title-row"><div><div class="section-kicker">YOUR MONTH AT A GLANCE</div><h2>Календар справ</h2></div><button class="link-btn" data-action="today">Сьогодні</button></div><div class="month-box"><div class="month-head"><button class="small-circle" data-action="month-prev">${icon('back')}</button><strong>${firstUpper(fmtMonth.format(d))}</strong><button class="small-circle" data-action="month-next">${icon('chev')}</button></div><div class="month-weekdays">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(w=>`<span>${w}</span>`).join('')}</div><div class="month-grid">`;
for(let i=0;i<42;i++){const daynum=i-startOffset+1;const at=new Date(year,month,daynum);const s=iso(at),other=at.getMonth()!==month,st=stats(s);cal+=`<button class="calday ${other?'outside':''} ${selected===s?'selected':''} ${s===todayISO()?'today':''}" data-action="jump-day" data-date="${s}" aria-label="${esc(fmt.format(at))}">${at.getDate()}${st.total?'<i></i>':''}</button>`}cal+='</div></div>';
const week=monday(selected);let sums='';for(let i=0;i<7;i++){const s=add(week,i),st=stats(s);sums+=`<button class="day-summary" data-action="jump-day" data-date="${s}"><span class="day-num">${date(s).getDate()}</span><span><strong>${['Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота','Неділя'][i]}</strong><br><span>${st.total?`${st.done}/${st.total} виконано`:'Немає справ'}</span></span>${icon('chev')}</button>`}return cal+`<div class="section-card"><div class="section-kicker">WEEKLY OUTLOOK</div><h3 style="margin-top:5px">Тиждень у деталях</h3><div class="calendar-summary">${sums}</div></div>`}
function streak(t,s){let n=0,c=s;for(let i=0;i<90;i++){if(!isOccur(t,c)){c=add(c,-1);continue;}if(done(t,c)){n++;c=add(c,-1)}else break}return n}
function renderHabits(){const recurring=data.tasks.filter(t=>t.repeat!=='none'&&isOccur(t,selected));const extra=data.tasks.filter(t=>t.repeat!=='none').length;return `${dateRail()}<div class="title-row"><div><div class="section-kicker">LITTLE THINGS, OFTEN</div><h2>Мої ритуали</h2></div><button class="link-btn" data-action="new-ritual">+ Додати</button></div><div class="section-card"><h3>Те, що підтримує тебе</h3><p>Щоденні або щотижневі справи повторюються автоматично. Галочка зараховується лише на обраний день.</p></div>${recurring.length?`<div>${recurring.map(t=>`<div class="habit-card"><div class="habit-icon">${esc(cats[t.category]?.mark||'✧')}</div><div><strong>${esc(t.title)}</strong><small>${t.repeat==='daily'?'Щодня':t.repeat==='weekdays'?'У будні':'Щотижня'} · ${streak(t,selected)} дн. поспіль</small></div><input class="task-check" type="checkbox" data-action="done-task" data-id="${esc(t.id)}" ${done(t,selected)?'checked':''} aria-label="Виконати ритуал ${esc(t.title)}"/></div>`).join('')}</div>`:`<div class="empty"><div class="empty-art">✧</div><strong>Твої маленькі ритуали</strong><p>Додай повторювану справу, щоб не вписувати її щодня заново.</p><button class="btn btn-primary" data-action="new-ritual">Створити ритуал</button></div>`}<div class="section-card"><div class="section-kicker">IDEAS TO BEGIN</div><h3 style="margin-top:7px">Ідеї для звички</h3><div class="preset-wrap"><button class="preset" data-action="preset" data-title="Ранкова зарядка" data-cat="self">Зарядка</button><button class="preset" data-action="preset" data-title="Англійська — 15 хв" data-cat="learn">Англійська</button><button class="preset" data-action="preset" data-title="Читання — 15 хв" data-cat="self">Читання</button><button class="preset" data-action="preset" data-title="Час для себе" data-cat="self">Відпочинок</button></div></div><p class="subtle" style="padding:0 5px">Усього повторюваних справ: ${extra}</p>`}
function renderJournal(){const r=dayRecord(selected);const s=stats(selected);return `${dateRail()}<div class="title-row"><div><div class="section-kicker">YOUR PRIVATE JOURNAL</div><h2>Нотатки дня</h2></div><span class="subtle">${esc(fmt.format(date(selected)))}</span></div><div class="section-card"><div class="section-kicker">MOOD CHECK-IN</div><h3 style="margin-top:7px">Як минув цей день?</h3><div class="mood-wrap">${Object.entries(moods).map(([id,m])=>`<button class="mood ${r.mood===id?'active':''}" data-action="mood" data-value="${id}"><span class="symbol">${m.icon}</span>${m.name}</button>`).join('')}</div><p>Без оцінок і тиску. Просто зафіксуй настрій, якщо хочеш.</p></div><div class="section-card"><div class="section-kicker">A LITTLE SPACE TO WRITE</div><h3 class="journal-hint" style="margin:10px 0 15px">Що важливого було сьогодні?</h3><div class="field"><label for="day-notes">Думки, ідеї, важливі події</label><textarea id="day-notes" placeholder="Напиши кілька слів про цей день…">${esc(r.note)}</textarea></div><p style="margin-top:8px">Записи зберігаються автоматично на цьому пристрої.</p></div><div class="mini-stat-wrap"><div class="mini-stat"><b>${s.total}</b><span>У плані</span></div><div class="mini-stat"><b>${s.done}</b><span>Зроблено</span></div><div class="mini-stat"><b>${Math.max(0,s.total-s.done)}</b><span>Залишилося</span></div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});const s=stats(selected);$('hero-date').textContent=firstUpper(fmt.format(date(selected)));$('hero-progress').textContent=`${s.done} із ${s.total} справ`; $('main').innerHTML=tab==='day'?renderDay():tab==='calendar'?renderCalendar():tab==='habits'?renderHabits():renderJournal();}
function showModal(html){$('sheet').innerHTML=html;$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeModal(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');$('sheet').innerHTML='';document.body.style.overflow=''}
const modalTop=(kicker,title)=>`<div class="sheet-top"><div><div class="section-kicker">${kicker}</div><h2>${title}</h2></div><button type="button" class="close" data-action="close" aria-label="Закрити">×</button></div>`;
let editing=null;
function taskModal(id=null,preset={}){const t=id?data.tasks.find(x=>x.id===id):null;if(id&&!t)return;editing=id;
const v=t||{title:preset.title||'',date:selected,time:'',category:preset.category||'work',priority:'normal',repeat:preset.repeat||'none',reminder:-1,note:''};
showModal(`${modalTop('PLAN YOUR DAY',t?'Редагувати справу':'Нова справа')}<form id="task-form"><div class="field"><label for="task-title">Що потрібно зробити?</label><input class="field-input" id="task-title" name="title" required maxlength="170" placeholder="Наприклад, підготувати презентацію" value="${esc(v.title)}" autocomplete="off"/></div><div class="half-fields"><div class="field"><label for="task-date">Дата</label><input class="field-input" id="task-date" name="date" type="date" required value="${esc(v.date)}"/></div><div class="field"><label for="task-time">Час (необов’язково)</label><input class="field-input" id="task-time" name="time" type="time" value="${esc(v.time||'')}"/></div></div><div class="half-fields"><div class="field"><label for="task-category">Сфера</label><select id="task-category" name="category">${Object.entries(cats).map(([k,c])=>`<option value="${k}" ${v.category===k?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label for="task-priority">Пріоритет</label><select id="task-priority" name="priority"><option value="normal" ${v.priority!=='high'?'selected':''}>Звичайна</option><option value="high" ${v.priority==='high'?'selected':''}>Важлива</option></select></div></div><div class="half-fields"><div class="field"><label for="task-repeat">Повторення</label><select id="task-repeat" name="repeat"><option value="none" ${v.repeat==='none'?'selected':''}>Один раз</option><option value="daily" ${v.repeat==='daily'?'selected':''}>Щодня</option><option value="weekdays" ${v.repeat==='weekdays'?'selected':''}>У будні</option><option value="weekly" ${v.repeat==='weekly'?'selected':''}>Щотижня</option></select></div><div class="field"><label for="task-reminder">Нагадати</label><select id="task-reminder" name="reminder"><option value="-1" ${v.reminder==null||v.reminder<0?'selected':''}>Без нагадування</option><option value="0" ${v.reminder===0?'selected':''}>У зазначений час</option><option value="5" ${v.reminder===5?'selected':''}>За 5 хв</option><option value="15" ${v.reminder===15?'selected':''}>За 15 хв</option><option value="30" ${v.reminder===30?'selected':''}>За 30 хв</option><option value="60" ${v.reminder===60?'selected':''}>За 1 год</option></select></div></div><div class="field"><label for="task-note">Нотатка до справи</label><textarea id="task-note" name="note" rows="3" placeholder="Деталі, адреса, список…">${esc(v.note||'')}</textarea></div><div class="form-meta">Нагадування надходитимуть через Android, якщо їх увімкнено в налаштуваннях і телефон надав дозвіл.</div><div class="form-buttons"><button type="submit" class="btn btn-primary">${t?'Зберегти зміни':'Додати справу'}</button>${t?`<button type="button" class="btn btn-secondary" data-action="delete-task" data-id="${esc(t.id)}" aria-label="Видалити справу">${icon('trash')}</button>`:''}</div></form>`);
setTimeout(()=>$('task-title')?.focus(),100)}
function settingsModal(){showModal(`${modalTop('YOUR SPACE','Налаштування')}<div class="section-card"><h3>Нагадування про справи</h3><p>У версії APK сповіщення можуть приходити й після закриття додатка. Для кожної справи має бути зазначений час і вибрано «Нагадати».</p><button class="btn btn-primary wide" data-action="enable-notifications">${data.settings.reminders?'Нагадування ввімкнені · оновити':'Увімкнути нагадування Android'}</button><div class="form-meta" style="margin-top:12px">У браузерній HTML-версії фонові сповіщення недоступні — можна експортувати події в календар.</div><button class="btn btn-quiet wide" style="margin-top:10px" data-action="export-calendar">Експортувати нагадування (.ics)</button></div><div class="section-card"><h3>Резервна копія</h3><p>Усі справи, ритуали та щоденні нотатки зберігаються локально. Зроби копію перед перевстановленням APK.</p><button class="btn btn-secondary wide" data-action="backup">Зберегти резервну копію</button><button class="btn btn-quiet wide" style="margin-top:9px" data-action="import">Відновити з копії</button></div><div class="section-card"><h3>Про додаток</h3><p>Atelier Day · Pearl Glass 1.0. Приватний планер без облікового запису, реклами та передавання справ на сервер.</p></div>`)}
function saveTask(fd){const title=String(fd.get('title')||'').trim();const dt=String(fd.get('date')||'');if(!title||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(dt)){toast('Вкажи назву та дату');return}const vals={title,date:dt,time:fd.get('time')||'',category:fd.get('category')||'other',priority:fd.get('priority')||'normal',repeat:fd.get('repeat')||'none',reminder:Number(fd.get('reminder')),note:String(fd.get('note')||'').trim()};const t=editing?data.tasks.find(x=>x.id===editing):null;if(t){Object.assign(t,vals)}else{data.tasks.push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),...vals,done:{},created:Date.now()})}selected=dt;monthCursor=dt.slice(0,7)+'-01';closeModal();store();render();toast(t?'Справу оновлено':'Справу додано')}
function toggleTask(id,isChecked){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=t.done||{};if(isChecked)t.done[selected]=true;else delete t.done[selected];store();render()}
function monthMove(n){const d=date(monthCursor);d.setMonth(d.getMonth()+n);monthCursor=iso(d).slice(0,7)+'-01';render()}
function downloadText(content,filename,type){const file=new Blob([content],{type});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(d,time){return d.replace(/-/g,'')+'T'+time.replace(':','')+'00'}
function exportICS(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Day//Pearl Glass 1.0//UK','CALSCALE:GREGORIAN'];for(const t of data.tasks){if(!t.time||t.reminder==null||t.reminder<0)continue;let ds=[];for(let i=0;i<90;i++){const day=add(todayISO(),i);if(isOccur(t,day))ds.push(day)}for(const d of ds){lines.push('BEGIN:VEVENT','UID:'+t.id+'-'+d+'@atelier.day','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),'DTSTART:'+icsDate(d,t.time),'DTEND:'+icsDate(d,t.time),'SUMMARY:'+icsEscape(t.title),'DESCRIPTION:'+icsEscape(t.note),'BEGIN:VALARM','TRIGGER:-PT'+Math.max(0,Number(t.reminder)||0)+'M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(t.title),'END:VALARM','END:VEVENT')}}lines.push('END:VCALENDAR');downloadText(lines.join('\r\n'),'Atelier_Day_calendar.ics','text/calendar');toast('Файл календаря підготовлено')}
function backup(){const txt=JSON.stringify({format:'atelier-day-v1',data,exported:new Date().toISOString()},null,2);if(window.NativePlanner?.shareBackup){window.NativePlanner.shareBackup(txt);toast('Відкрито поширення копії')}else{downloadText(txt,'Atelier_Day_backup.json','application/json');toast('Резервну копію збережено')}}
function importModal(){showModal(`${modalTop('BACKUP','Відновлення справ')}<p class="form-meta">Встав сюди текст JSON із резервної копії. Поточні справи буде замінено даними з копії.</p><div class="field"><label for="backup-json">Дані резервної копії</label><textarea id="backup-json" rows="9" placeholder="Встав JSON…"></textarea></div><button type="button" class="btn btn-secondary wide" style="margin-bottom:9px" data-action="choose-backup">Обрати JSON-файл на телефоні</button><button class="btn btn-primary wide" data-action="import-confirm">Відновити дані</button>`)}
window.AtelierReceiveBackup=raw=>{if(!$('backup-json'))importModal();$('backup-json').value=String(raw||'');toast('Копію завантажено — натисни «Відновити дані»')};
function restore(){try{const parsed=JSON.parse($('backup-json').value);if(parsed.format!=='atelier-day-v1'||!Array.isArray(parsed.data?.tasks)||!parsed.data?.days||!parsed.data?.settings)throw Error('Формат копії невірний');if(!window.confirm('Замінити поточні справи, ритуали та нотатки з цієї копії?'))return;data=parsed.data;store();closeModal();render();toast('Дані відновлено')}catch(e){toast('Не вдалося прочитати копію')}}
function syncNative(){if(window.NativePlanner?.syncTasks){try{window.NativePlanner.syncTasks(JSON.stringify({enabled:Boolean(data.settings.reminders),tasks:data.tasks.map(t=>({id:t.id,title:t.title,date:t.date,time:t.time,repeat:t.repeat,reminder:t.reminder,doneDates:Object.keys(t.done||{}).filter(d=>t.done[d])})).filter(t=>t.time&&t.reminder>=0)}))}catch(e){}}}
function enableNative(){data.settings.reminders=true;store();const payload=JSON.stringify({enabled:true,tasks:data.tasks.map(t=>({id:t.id,title:t.title,date:t.date,time:t.time,repeat:t.repeat,reminder:t.reminder,doneDates:Object.keys(t.done||{}).filter(d=>t.done[d])})).filter(t=>t.time&&t.reminder>=0)});if(window.NativePlanner?.enableReminders){try{window.NativePlanner.enableReminders(payload);toast('Запит дозволу на сповіщення')}catch(e){toast('Не вдалось увімкнути нагадування')}}else{toast('У браузері сповіщення працюють через календар')}settingsModal()}
function handleAction(el){const action=el.dataset.action||'';switch(action){case 'settings':settingsModal();break;case 'close':closeModal();break;case 'new-task':taskModal();break;case 'new-ritual':taskModal(null,{repeat:'daily',category:'self'});break;case 'preset':taskModal(null,{title:el.dataset.title,repeat:'daily',category:el.dataset.cat});break;case 'edit-task':taskModal(el.dataset.id);break;case 'delete-task':if(window.confirm('Видалити цю справу? Повторення теж буде видалено.')){data.tasks=data.tasks.filter(x=>x.id!==el.dataset.id);closeModal();store();render();toast('Справу видалено')}break;case 'prev-week':selected=add(selected,-7);monthCursor=selected.slice(0,7)+'-01';render();break;case 'next-week':selected=add(selected,7);monthCursor=selected.slice(0,7)+'-01';render();break;case 'today':selected=todayISO();monthCursor=selected.slice(0,7)+'-01';tab='day';filter='all';render();break;case 'select-date':selected=el.dataset.date;monthCursor=selected.slice(0,7)+'-01';render();break;case 'jump-day':selected=el.dataset.date;monthCursor=selected.slice(0,7)+'-01';tab='day';filter='all';render();break;case 'month-prev':monthMove(-1);break;case 'month-next':monthMove(1);break;case 'filter':filter=el.dataset.value;render();break;case 'mood':dayRecord(selected).mood=el.dataset.value;store(false);render();break;case 'enable-notifications':enableNative();break;case 'export-calendar':exportICS();break;case 'backup':backup();break;case 'import':importModal();break;case 'choose-backup':if(window.NativePlanner?.pickBackup){window.NativePlanner.pickBackup()}else{toast('В Android-версії можна обрати файл. Тут встав JSON')}break;case 'import-confirm':restore();break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handleAction(b);const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('change',e=>{if(e.target.matches('[data-action="done-task"]'))toggleTask(e.target.dataset.id,e.target.checked)});
document.addEventListener('input',e=>{if(e.target.id==='day-notes'){dayRecord(selected).note=e.target.value;store(false)}});
document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();saveTask(new FormData(e.target))}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();syncNative();
})();
</script></body></html>
